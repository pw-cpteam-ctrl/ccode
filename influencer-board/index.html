<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 검색에 잡히지 않게 막는다. 담당자만 주소를 알고 들어오는 페이지다. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>인플루언서 보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #1c1917; --ink-500: #78716c; --ink-400: #a8a29e;
    --line: #e7e5e4; --bg: #f5f5f4; --card: #fff;
    --blue: #2563eb; --green: #16a34a; --red: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px; line-height: 1.5;
  }
  /* 열이 늘어난 뒤로 1040px 안에서는 표가 늘 넘쳐 가로로 밀어 봐야 했다.
     화면이 넓으면 그만큼 쓰고, 좁은 화면에서는 그대로 화면 폭에 맞춘다. */
  /* 표가 쓰는 만큼만 차지하고 가운데 둔다. 화면 폭에 억지로 맞추면 남는 공간이
     칸 사이로 뿌려지거나 빈 칸으로 남아 표가 헐거워 보인다. */
  /* 폭은 표가 정한다. 표만 가로로 밀리고 위쪽 상자들은 짧게 남으면 선이 어긋나
     보여서, 페이지 전체가 표 폭을 따라간다(좁은 화면에서는 페이지가 가로로 밀린다). */
  /* 화면이 아무리 넓어도 여기까지만 쓴다. 끝까지 늘리면 표가 너무 벌어져
     눈이 가로로 멀리 움직여야 한다. 양옆은 여백으로 둔다. */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 60px; box-sizing: border-box; }
  /* 위쪽 상자들은 표 폭에 맞춘다(아래 fitToTable이 재서 넣는다). 표는 내용만큼만
     쓰므로, 폭을 CSS로 맞출 방법이 없어 그린 뒤에 재서 맞춘다. */
  .fitw { width: 100%; box-sizing: border-box; }

  /* ─── 코드 입력 ─── */
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-card {
    width: 100%; max-width: 340px; background: var(--card);
    border-radius: 16px; padding: 32px 24px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04);
  }
  .gate-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .gate-desc { font-size: 12.5px; color: var(--ink-500); margin: 0 0 20px; }
  .input {
    width: 100%; padding: 12px 14px; font-size: 16px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: #fafaf9; color: var(--ink); outline: none;
  }
  .input:focus { border-color: var(--ink); background: #fff; }
  .btn {
    width: 100%; padding: 12px; margin-top: 10px;
    font-size: 14px; font-weight: 600; color: #fff; background: var(--ink);
    border: 0; border-radius: 10px; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 12.5px; min-height: 18px; margin-top: 8px; color: var(--red); }
  /* 차단 안내 — 평소엔 아예 안 나온다. 나왔다는 것 자체가 봐야 할 일이라
     표 아래에서도 눈에 띄도록 붉은 테두리를 두른다. */
  .blocked { margin-top: 18px; padding: 12px 14px; border: 1px solid var(--red); border-radius: 8px; font-size: 13px; }
  .blocked-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .blocked-at { color: #777; font-size: 12px; }
  .blocked-note { margin: 10px 0 0; font-size: 12px; color: #777; }

  /* ─── 목록 ─── */
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .head h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  .head .count { font-size: 13px; color: var(--ink-500); }
  .sub { font-size: 12.5px; color: var(--ink-500); margin: 0 0 16px; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .bar .search {
    flex: 1; min-width: 180px; padding: 9px 12px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 9px; background: #fff; outline: none;
  }
  .bar .search:focus { border-color: var(--ink); }
  .mini {
    padding: 9px 13px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .mini:hover { background: #fafaf9; }
  .mini.is-done { border-color: var(--green); color: var(--green); }
  /* 수령 방식은 눌러서 바꿀 수 있다 — 모종의 사정으로 바뀌는 경우가 있어서 */
  .tag-btn { border: 1px dashed transparent; cursor: pointer; font-family: inherit; }
  .tag-btn:hover { border-color: currentColor; }
  td.trackcell { white-space: nowrap; }
  .track-note { display: block; font-size: 10.5px; color: var(--ink-400); margin-top: 2px; white-space: nowrap; }
  /* 업로드가 확인된 건은 초안 날짜에 금을 긋는다 — 기다리는 날짜가 아니게 되므로 */
  td.draft.is-uploaded { text-decoration: line-through; color: var(--ink-400); }

  /* 내용만큼만 늘어나되 화면보다 좁아지지는 않게. 폭을 화면에 억지로 맞추면
     긴 희망 상품이 서너 줄로 접혀 행이 부푼다. */
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  th, td { padding: 11px 8px; text-align: left; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  th { background: #fafaf9; font-size: 11.5px; font-weight: 700; color: var(--ink-500); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.nick { font-weight: 700; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; }
  /* 수령 방식은 칩 대신 앞에 점 하나로. 한 줄에 칩이 셋이나 되어 산만했다. */
  .tag.split, .tag.after { background: none; padding: 2px 0; color: #000; }
  .tag.split::before, .tag.after::before {
    content: ''; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 6px; vertical-align: 1px;
  }
  .tag.split::before { background: #2563eb; }
  .tag.after::before { background: #d97706; }
  /* 보상 형태도 배경을 빼고 글자색만 남긴다. 무엇인지는 앞의 그림으로 읽힌다. */
  .tag.coupon { background: none; padding: 2px 0; color: #15803d; }
  .tag.goods { background: none; padding: 2px 0; color: #be185d; }
  .tag.coupon::before { content: '💵 '; }
  .tag.goods::before { content: '🧸 '; }
  .tag.ok { background: #f0fdf4; color: var(--green); }
  /* 같은 사람이 여러 번 낸 경우, 지난 제출은 흐리게 해서 최신만 눈에 들어오게 한다 */
  tr.is-old td { color: var(--ink-400); background: #fcfcfb; }
  tr.is-old td.nick { font-weight: 400; }
  .old-note { font-size: 11.5px; color: var(--ink-400); white-space: nowrap; }
  /* 접속일 기준 남은 날짜. 오늘·임박·지남만 색으로 구분해 눈에 걸리게 한다. */
  .dday {
    display: inline-block; padding: 2px 7px; border-radius: 6px;
    font-size: 11.5px; font-weight: 800; letter-spacing: -0.01em;
    background: #f1f5f9; color: #475569; white-space: nowrap;
  }
  .dday.soon { background: #fff7ed; color: #c2410c; }
  .dday.today { background: #fef2f2; color: #b91c1c; }
  .dday.past { background: #f8fafc; color: #94a3b8; }
  /* 아이디를 메일 주소로 적는 분이 있어 한 칸이 길어지면 표 전체가 밀려
     오른쪽이 잘렸다. 10자 남짓에서 끊고, 누르면 그 칸만 전부 펼친다.
     (마우스를 올려도 전체가 말풍선으로 뜨고, 복사 표에는 늘 전체가 들어간다) */
  td.naver { max-width: 11ch; }
  /* 긴 아이디는 칸 안에서 좌우로 천천히 오가게 둔다. 한 칸씩 눌러서 펼치면
     여러 건을 훑어볼 때 매번 눌러야 해서, 가만히 둬도 전체가 읽히게 한다.
     움직이는 거리에 맞춰 시간을 주므로 길수록 느리게 흐른다. */
  td.naver .roll { display: block; overflow: hidden; white-space: nowrap; }
  td.naver .roll > span { display: inline-block; }
  td.naver .roll.is-long > span,
  td.wish .roll.is-long > span {
    animation: naver-roll var(--roll-sec, 6s) ease-in-out infinite alternate;
  }
  @keyframes naver-roll {
    0%, 18% { transform: translateX(0); }
    82%, 100% { transform: translateX(var(--roll-x, 0)); }
  }
  /* 화면 읽기 설정에서 움직임을 줄이도록 해 둔 경우엔 흐르지 않게 한다 */
  @media (prefers-reduced-motion: reduce) {
    td.naver .roll.is-long > span, td.wish .roll.is-long > span { animation: none; }
  }
  /* 희망 상품은 반대로 너무 좁아 글이 계속 접혔다. 아이디 칸만큼은 준다. */
  /* 희망 상품도 한 줄로 둔다. 줄바꿈을 허용했더니 긴 상품명 하나 때문에
     그 행만 두 배로 높아져 표가 들쑥날쑥했다. 넘치면 아이디처럼 흐른다. */
  /* 한글 12자 기준. ch는 숫자 폭이라 한글로 치면 절반밖에 안 들어간다. */
  /* 남는 폭은 전부 이 칸이 가져간다 — 글자가 가장 모자란 칸이라서다.
     나머지 열은 내용 폭에 고정해(width:1px) 남는 자리가 칸마다 뿌려지지 않게 한다. */
  th.wishcol, td.wish { width: 100%; min-width: 4em; }
  /* 접수 목록 표(.listtable) 전용. 예전엔 모든 table에 걸려서 새 표(쿠폰·연락 이력)를 만들 때마다 폰에서 칸이 0으로 눌렸다 — 새 표는 자기 규칙으로 폭을 정한다 */
  table.listtable thead th:not(.wishcol), table.listtable tbody td:not(.wish) { width: 1px; }
  /* 두 줄로 쪼개지던 칸들 */
  td .tag, th:nth-child(9), td:nth-child(9), td:nth-child(10) { white-space: nowrap; }
  td.wish .roll { display: block; overflow: hidden; white-space: nowrap; }
  td.wish .roll > span { display: inline-block; }
  /* 세 단계로 가라앉힌다 — 이번 달·날짜 지남 → 지난 달 → 담당자가 내린 건.
     어느 것도 지우지 않는다. 기록은 남고 눈에 덜 걸리게만 한다. */
  /* 지급이 남아 있는 건은 또렷한 검정으로 둔다 — 지금 챙길 것 */
  tbody td { color: #000; }
  /* 지급까지 끝난 건만 가라앉힌다 */
  tr.is-done td { color: #a3a3a0; background: #f6f6f4; }
  tr.is-done td.nick { font-weight: 400; }
  tr.is-done .tag, tr.is-done .dday { opacity: .45; }
  tr.is-done .mini { opacity: .5; }

  tr.is-archived td { color: #9c9c99; background: #ebebe8; }
  tr.is-archived td.nick { font-weight: 400; text-decoration: line-through; }
  tr.is-archived .tag, tr.is-archived .dday { opacity: .35; }
  tr.is-archived .mini { opacity: .5; }
  /* 1차만 지급한 건 — 아직 끝난 게 아니라 완료보다 옅게 둔다 */
  tr.is-part td { color: #7a7a75; background: #fafaf9; }
  tr.is-part td.nick { font-weight: 600; }
  tr.is-part .tag, tr.is-part .dday { opacity: .6; }
  .mini.is-part { border-color: #c2410c; color: #c2410c; }
  tr.grouprow.is-settled .group-when { color: var(--ink-500); }

  /* 끌어서 고르는 중 */
  tr.is-picked td { background: #eff6ff; color: var(--ink); }
  tr.is-picked td.nick { font-weight: 700; }
  th.pick, td.pick { width: 30px; padding-right: 0; cursor: cell; }
  td.pick input { pointer-events: none; }  /* 고르기는 줄 전체를 끄는 것으로 한다 */
  /* 글자를 복사할 수 있어야 한다. 끌어서 고르는 동안에만 선택을 막는다. */
  tbody tr { cursor: default; }
  body.is-dragging, body.is-dragging tbody tr { user-select: none; }

  /* 고른 뒤 나오는 아래쪽 띠 */
  .pickbar {
    position: sticky; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 10px; padding: 10px 12px;
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .pickbar-n { font-size: 13.5px; font-weight: 700; margin-right: 2px; }
  .mini.is-main { border-color: #1d4ed8; color: #1d4ed8; font-weight: 700; }

  /* 오픈 날짜 관리 — 평소엔 접어 두고, 바꿀 때만 펼친다 */
  .open-box {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 14px;
  }
  .open-box > summary {
    cursor: pointer; font-size: 13.5px; font-weight: 700; list-style: none;
  }
  .open-box > summary::-webkit-details-marker { display: none; }
  .open-box > summary::before { content: '📅 '; }
  .open-sum { font-weight: 400; font-size: 12px; color: var(--ink-500); margin-left: 6px; }
  .open-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .open-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .open-month { width: 42px; font-weight: 700; font-size: 13.5px; }
  .open-pick {
    padding: 6px 9px; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .open-row.is-set .open-pick { border-color: #1d4ed8; color: #1d4ed8; font-weight: 700; }
  .open-note { font-size: 12px; color: var(--ink-500); }
  .open-row.is-set .open-note { color: #1d4ed8; }
  .open-reset { padding: 5px 9px; font-size: 12px; }
  .open-foot { margin: 12px 0 0; font-size: 12px; color: var(--ink-500); }
  /* 지난 제출 접기 — 같은 분이 여러 번 낸 것은 최신 한 줄로 모으고, 눌러서 편다 */
  /* 활동명은 다섯 자까지만 보여주고 넘치면 자른다. 전체는 마우스를 올리면 뜬다.
     이름이 길거나 '지난 제출' 표시가 붙었다고 칸이 늘어나면 표 전체가 밀린다. */
  td.nick { white-space: nowrap; }
  .nick-name {
    display: inline-block; max-width: 5.2em; vertical-align: middle;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .old-toggle {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    background: none; border: 0; padding: 0; font: inherit; font-weight: 700;
    color: inherit; cursor: pointer; text-align: left;
  }
  .old-arrow { display: inline-block; transition: transform .15s; color: var(--ink-400); }
  .old-toggle[aria-expanded="true"] .old-arrow { transform: rotate(90deg); }
  .old-n {
    font-size: 10.5px; font-weight: 700; color: var(--ink-500); white-space: nowrap;
    background: #f1f5f9; border-radius: 999px; padding: 1px 6px;
  }
  .old-child { color: var(--ink-400); white-space: nowrap; }

  /* 예상 지급 시기 — 날짜를 위에, 무엇인지 아래에 작게 */
  td.paycell { white-space: nowrap; }
  .pay-cond { font-weight: 600; opacity: .75; }
  .pay { display: inline-flex; flex-direction: column; gap: 2px; line-height: 1.35; }
  .pay em { font-style: normal; font-size: 11px; color: var(--ink-500); }
  /* 열 제목을 눌러 정렬 기준을 바꾼다. 바에 버튼을 더 두지 않으려고 이렇게 했다. */
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--ink); }
  th.sortable.is-on { color: #1d4ed8; }
  .sort-ar { font-size: 9px; }

  /* 가까운 지급끼리 묶어 주는 머리줄 */
  tr.grouprow td {
    background: #f8fafc; padding: 7px 10px; border-bottom: 1px solid var(--line);
  }
  .group-when { font-size: 11.5px; font-weight: 800; color: #0b3d91; letter-spacing: -0.01em; }
  .group-n {
    margin-left: 7px; font-size: 10.5px; font-weight: 700; color: var(--ink-500);
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px;
  }
  .paid-note { display: block; font-size: 10.5px; color: var(--ink-400); margin-top: 3px; white-space: nowrap; }
  .paychip {
    display: inline-block; font-size: 13px; font-weight: 700;
    padding: 3px 9px; border-radius: 7px; letter-spacing: -0.01em;
  }
  .paychip.now { background: #cfe3ff; color: #0b3d91; font-weight: 800; }
  .paychip.left { background: #eef4fb; color: #3b6aa8; font-weight: 700; }
  .paychip.done { background: none; color: #a3a3a0; font-weight: 600; padding-left: 0; }
  .pay em { font-style: normal; font-size: 11px; color: var(--ink-500); }
  .pay-none { color: var(--ink-400); }
  .empty { padding: 40px 16px; text-align: center; color: var(--ink-500); }
  .scroll { overflow-x: auto; }
  .foot { margin-top: 14px; font-size: 12px; color: var(--ink-400); line-height: 1.6; }

  /* ─── 화면 전환 탭 ─── */
  .tabs { display: flex; gap: 4px; margin: 6px 0 14px; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 9px 14px; font-size: 14px; font-weight: 700; color: var(--ink-500);
    background: none; border: 0; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
    cursor: pointer; font-family: inherit;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-on { color: var(--ink); border-bottom-color: var(--ink); }

  /* ─── 회차 현황 ─── */
  .rbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .rbox-h { font-size: 15px; margin: 0 0 2px; }

<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  // 이 페이지는 담당자만 쓴다. 관리자 코드는 서버에서 대조하며, 여기에는
  // 정답이 들어 있지 않다.
  //
  // 코드는 이 브라우저에 2일간 기억해 둔다. 매번 입력하게 하면 담당자가 하루에도
  // 몇 번씩 코드를 찾아 넣어야 해서 실제로 안 쓰게 된다. 다만 무기한으로 두면
  // 공용 PC에 열어둔 채 잊는 상황이 생기므로 기간을 짧게 잡는다.
  var CODE_KEY = 'cg-admin';
  var CODE_DAYS = 2;
  var TRACK = { split: '선지급', after: '후지급' };
  var REWARD = { coupon: '금액 쿠폰', goods: '상품 쿠폰' };

  var root = document.getElementById('root');
  var code = '';
  var rows = [];
  var confirmed = {};
  var blocked = {};   // 코드를 너무 여러 번 틀려 차단된 접속 지점
  var openDays = {};  // 기본(첫 목요일)과 다른 달의 오픈 날짜. 'YYYY-MM': 일
  var archived = {};  // 담당자가 내려 둔 건 (차수 열쇠 기준)
  var picked = {};    // 지금 드래그로 고른 건 (화면에서만 쓰는 임시 값)
  var openRounds = {};// 지난 제출을 펼쳐 둔 차수
  var trackOver = {}; // 담당자가 바꾼 수령 방식 (차수 열쇠 → {track})
  var candidates = {};// 노션에서 확정된 후보 (활동명 → {at, link})
  var candMsg = '';   // 가져온 직후 한 번 보여줄 안내 (화면에서만 쓰는 값)
  var mailInfo = null;// 올린 메일 파일을 읽은 결과 (화면에서만 쓰는 값 — 서버로 보내지도 저장하지도 않는다)
  var mailMsg = '';   // 읽은 직후 한 번 보여줄 안내
  var mailOpen = {};    // 눌러서 펼친 메일 (화면에서만 쓰는 값)
  var draftOpen = {};   // 답장 입력칸을 펼친 크리에이터 (화면에서만 쓰는 값)
  var mailBody = {};    // 펼친 메일의 본문 (저장하지 않는다 — 새로고침하면 사라진다)
  var mailEvents = [];  // 메일함에서 가져와 비공개 저장소에 쌓인 연락 이력 (본문 없음)
  var mailFileMsgs = [];// 올린 파일에서 읽은 메시지 (화면에서만 씀)
  var mailFileMeta = { mails: 0, fw: 0 };
  var mailSync = { loaded: false, syncedAt: null, configured: false, busy: false, note: '' };
  // 정렬 기준. 'pay'는 다음 지급일 순(기본), 'draft'는 초안 공유 예정일 순.
  // 열 제목을 눌러 바꾸고, 고른 기준은 이 기기에 남는다.
  var SORT_KEY = 'cg-admin-sort';
  var sortBy = (function () {
    try { return localStorage.getItem(SORT_KEY) === 'draft' ? 'draft' : 'pay'; }
    catch (e) { return 'pay'; }
  })();
  var keyword = '';
  // 보는 화면. 'list' 접수 목록 / 'round' 회차 현황 / 'coupon' 쿠폰 발급. 고른 화면은 이 기기에 남는다.
  var VIEW_KEY = 'ib-view';
  // 연락 이력에서 화면에 보여줄 기간(마지막 메일이 며칠 안인 사람만). 가져온 데이터는 그대로 두고 보기만 줄인다. 0 = 전체
  var MAIL_AUTO_HOURS = 5;   // 연락 이력을 열었을 때 이 시간이 넘었으면 자동으로 가져온다(서버는 매일 밤 23시 무렵에도 따로 가져온다)
  var MAIL_RANGE_KEY = 'ib-mail-range', MAIL_RANGES = [14, 30, 50, 100, 200, 400, 0];
  function mailRange() {
    try { var v = localStorage.getItem(MAIL_RANGE_KEY); if (v !== null && MAIL_RANGES.indexOf(Number(v)) >= 0) return Number(v); } catch (e) { /* 기본값 */ }
    return 50;
  }
  function mailRangeSet(n) { try { localStorage.setItem(MAIL_RANGE_KEY, String(n)); } catch (e) { /* 저장 못 해도 이번 화면에는 적용 */ } }
  var VIEWS = { list: '접수 목록', round: '회차 현황', coupon: '쿠폰 발급', cand: '확정 후보', mail: '연락 이력' };
  var view = (function () {
    try { var v = localStorage.getItem(VIEW_KEY); return VIEWS[v] ? v : 'list'; }
    catch (e) { return 'list'; }
  })();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(v) {
    var p = String(v || '').split('-');
    if (p.length !== 3) return v || '-';
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var w = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    return (+p[1]) + '/' + (+p[2]) + ' (' + w + ')';
  }

  // 접속한 오늘을 기준으로 초안 공유 예정일까지 며칠 남았는지.
  // 아직 안 온 날은 D-n, 당일은 D-DAY, 지난 날은 D+n으로 적는다.
  function ddayNum(v) {
    var p = String(v || '').split('-');
    if (p.length !== 3) return null;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(d.getTime())) return null;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 864e5);
  }

  function fmtDday(v) {
    var n = ddayNum(v);
    if (n === null) return '-';
    if (n === 0) return 'D-DAY';
    return n > 0 ? 'D-' + n : 'D+' + (-n);
  }

  function ddayClass(v) {
    var n = ddayNum(v);
    if (n === null) return '';
    if (n < 0) return ' past';
    if (n === 0) return ' today';
    return n <= 3 ? ' soon' : '';
  }

  function fmtAt(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function rememberCode(v) {
    try {
      localStorage.setItem(CODE_KEY, JSON.stringify({ code: v, until: Date.now() + CODE_DAYS * 864e5 }));
    } catch (e) { /* 저장 못 해도 이번 이용엔 지장 없다 */ }
  }

  function recallCode() {
    try {
      var saved = JSON.parse(localStorage.getItem(CODE_KEY) || 'null');
      if (saved && saved.code && saved.until > Date.now()) return saved.code;
      localStorage.removeItem(CODE_KEY);
    } catch (e) { /* 무시 */ }
    return '';
  }

  function forgetCode() {
    try { localStorage.removeItem(CODE_KEY); } catch (e) { /* 무시 */ }
  }

  function api(body) {
    return fetch('api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        return { status: r.status, data: d };
      });
    });
  }

  // ─── 코드 입력 화면 ───
  // 코드는 맞는데 접수 기록 저장소를 읽지 못할 때의 안내. 이때 '빈 목록'을 보여주면
  // 데이터가 사라진 것처럼 보이므로 이유를 그대로 알려준다.
  function repoMsg(reason) {
    if (reason === 'token') return '접속 코드는 맞지만, 접수 기록 저장소의 GitHub 키가 올바르지 않거나 만료되었습니다. 개발 담당자에게 키 확인을 요청해 주세요.';
    if (reason === 'perm' || reason === 'repo') return '접속 코드는 맞지만, 접수 기록 저장소(비공개)를 읽지 못했습니다. 기록은 사라지지 않았습니다. 개발 담당자에게 GitHub 키의 저장소 권한을 확인해 달라고 요청해 주세요.';
    return '';
  }

  function renderGate(message) {
    root.innerHTML =
      '<div class="gate"><div class="gate-card">' +
      '<p class="gate-title">진행 정보 접수 현황</p>' +
      '<p class="gate-desc">담당자용 페이지입니다.</p>' +
      '<input class="input" id="code" type="password" placeholder="관리자 코드" autocomplete="off" />' +
      '<button class="btn" id="go">확인</button>' +
      '<p class="msg">' + esc(message || '') + '</p>' +
      '</div></div>';
    var input = document.getElementById('code');
    var go = document.getElementById('go');
    var submit = function () {
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      go.disabled = true;
      document.querySelector('.msg').textContent = '불러오는 중…';
      api({ code: v, action: 'list' }).then(function (r) {
        if (r.status === 200 && r.data.ok) {
          code = v;
          rememberCode(v);
          rows = r.data.rows || [];
          confirmed = r.data.confirmed || {};
        openDays = r.data.openDays || openDays;
        archived = r.data.archived || archived;
          trackOver = r.data.trackOverride || trackOver; candidates = r.data.candidates || candidates;
          blocked = r.data.blocked || {};
          renderList();
        } else if (r.status === 401) {
          go.disabled = false;
          forgetCode();   // 코드가 바뀐 경우 — 기억해 둔 값을 버린다
          // 남은 횟수를 알려준다. 모르고 계속 틀리다 갑자기 잠기면
          // 코드를 잊은 담당자가 영문도 모르고 막히기 때문이다.
          var left = r.data.left;
          renderGate('코드가 맞지 않습니다.' + (left ? ' (' + left + '번 더 틀리면 잠시 잠깁니다)' : ''));
        } else if (r.status === 429) {
          go.disabled = false;
          renderGate('여러 번 틀려서 잠시 잠겼습니다. 약 ' + (r.data.minutes || 10) + '분 후에 다시 시도해 주세요.');
        } else if (r.status === 403) {
          go.disabled = false;
          forgetCode();
          renderGate('너무 여러 번 틀려서 접근이 차단되었습니다. 관리자에게 문의해 주세요.');
        } else if (repoMsg(r.data.reason)) {
          go.disabled = false;
          renderGate(repoMsg(r.data.reason));
        } else if (r.data.reason === 'unconfigured') {
          go.disabled = false;
          renderGate('아직 설정이 끝나지 않았습니다. 개발 담당자에게 문의해 주세요.');
        } else {
          go.disabled = false;
          renderGate('불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        }
      }).catch(function () {
        go.disabled = false;
        renderGate('연결이 불안정합니다. 다시 시도해 주세요.');
      });
    };
    go.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    input.focus();
  }

  // ─── 차수 나누기 ───
  // 같은 분이라도 달마다 새 상품으로 또 협업하는 경우가 있다. 예전에는 활동명만
  // 보고 "가장 나중 것 하나"만 남겨서, 지난달 건이 이번 달 제출에 덮여 사라졌다.
  //
  // 그래서 제출 사이의 간격으로 나눈다. 앞 제출로부터 ROUND_GAP_DAYS일 안에 다시
  // 내면 "고쳐 낸 것"으로 보고 마지막 것만 남기고, 그보다 벌어지면 "다른 차수"로
  // 보고 각각 따로 남긴다. 2주든 한 달이든 모두 별개로 남는다.
  var ROUND_GAP_DAYS = 7;
  var ROUND_GAP_MS = ROUND_GAP_DAYS * 24 * 60 * 60 * 1000;

  function withLatestFlag(list) {
    // 활동명별로 모아 시간순(오래된 것부터)으로 훑으며 차수를 끊는다.
    var byNick = {};
    list.forEach(function (r) {
      (byNick[r.nick] = byNick[r.nick] || []).push(r);
    });

    var out = [];
    Object.keys(byNick).forEach(function (nick) {
      var mine = byNick[nick].slice().sort(function (a, b) {
        return String(a.at || '').localeCompare(String(b.at || ''));
      });
      var round = [];
      var rounds = [round];
      for (var i = 0; i < mine.length; i++) {
        if (i > 0) {
          var gap = new Date(mine[i].at) - new Date(mine[i - 1].at);
          if (!(gap <= ROUND_GAP_MS)) { round = []; rounds.push(round); }
        }
        round.push(mine[i]);
      }
      rounds.forEach(function (group) {
        // 한 차수 안에서는 마지막에 낸 것만 유효하다.
        // 확정 표시는 차수마다 따로 달려야 하므로, 그 차수의 첫 제출 날짜를
        // 활동명 뒤에 붙여 열쇠로 쓴다. 차수는 7일 넘게 떨어져 있어서 날짜가
        // 겹칠 수 없고, 저장된 파일을 열어봐도 어느 차수인지 바로 읽힌다.
        var key = nick + ' | ' + String(group[0].at || '').slice(0, 10);
        group.forEach(function (r, i) {
          out.push(Object.assign({}, r, { latest: i === group.length - 1, roundKey: key }));
        });
      });
    });

    // 정렬은 제출 시각이 아니라 초안 공유 예정일 기준이다. 담당자가 보는 건
    // "언제 받기로 했나"이지 "언제 냈나"가 아니라서다. 아직 멀리 남은 건이
    // 위, 날짜가 가깝거나 이미 지난 건이 아래로 내려간다.
    // 같은 차수의 지난 제출은 그 차수의 최신 제출 바로 아래에 붙여 둔다.
    var keyDate = {};
    out.forEach(function (r) { if (r.latest) keyDate[r.roundKey] = r.draftDate || ''; });
    return out.sort(function (a, b) {
      // 담당자가 내려 둔 건은 날짜와 상관없이 맨 아래로 보낸다.
      var rank = function (x) { var st = archived[x.roundKey]; return !st ? 0 : (st.stage === 'part' ? 1 : 2); };
      var aa = rank(a), ab = rank(b);
      if (aa !== ab) return aa - ab;
      if (sortBy === 'pay') {
        // 다음에 나갈 날짜가 가까운 것부터. 지급을 챙길 때 쓰는 순서다.
        var pa = nextPayTime(a), pb = nextPayTime(b);
        if (pa !== pb) return pa - pb;
      } else {
        var da = keyDate[a.roundKey] || '', db = keyDate[b.roundKey] || '';
        if (da !== db) {
          if (!da) return 1;           // 날짜를 안 적은 건은 맨 아래
          if (!db) return -1;
          return db.localeCompare(da); // 먼 날짜가 위
        }
      }
      if (a.latest !== b.latest) return a.latest ? -1 : 1;
      return String(b.at || '').localeCompare(String(a.at || ''));
    });
  }

  // 확정 여부 — 차수별 열쇠로 본다. 차수 개념이 생기기 전에 활동명만으로
  // 저장해 둔 기록도 있어서, 그것도 같이 인정한다(없는 척하면 예전에 확정해
  // 둔 것이 전부 풀린 것처럼 보인다).
  function isConfirmed(r) {
    return !!(confirmed[r.roundKey] || confirmed[r.nick]);
  }

  function visibleRows() {
    var all = withLatestFlag(rows);
    if (!keyword) return all;
    var k = keyword.toLowerCase();
    return all.filter(function (r) { return String(r.nick || '').toLowerCase().indexOf(k) >= 0; });
  }

  // 노션에 그대로 붙여넣을 수 있게 탭으로 구분한 표를 만든다.
  // 최신 제출만 담는다 — 지난 제출까지 넘어가면 중복 행이 생긴다.
  function tableText() {
    var head = ['활동명', '네이버 아이디', '초안 공유 예정일', 'D-day', '수령 방식', '예상 지급 시기', '보상 형태', '희망 상품', '제출 시각', '업로드', '리워드 지급 확인'];
    var lines = [head.join('\t')];
    visibleRows().filter(function (r) { return r.latest && !isArchived(r); }).forEach(function (r) {
      lines.push([
        r.nick,
        r.naver || '',
        fmtDate(r.draftDate),
        fmtDday(r.draftDate),
        (TRACK[trackOf(r)] || trackOf(r)) + (trackChanged(r) ? ' (담당자 변경)' : ''),
        (function () {
          var p = payPlan(r);
          if (!p) return '';
          return r.track === 'split' ? ('1차 ' + p.first + ' / 2차 ' + p.second + ' 전후') : (p.second + ' 전후');
        })(),
        REWARD[r.reward] || r.reward,
        r.wish || '',
        fmtAt(r.at),
        isConfirmed(r) ? '확인함' : '',
        isArchived(r) ? '지급함' : '',
      ].join('\t'));
    });
    return lines.join('\n');
  }

  function copyTable(btn) {
    var text = tableText();
    var done = function () {
      btn.textContent = '✓ 복사됐어요';
      btn.classList.add('is-done');
      setTimeout(function () { btn.textContent = '표 전체 복사'; btn.classList.remove('is-done'); }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }

  function fallback(text, done) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) {
      window.prompt('아래 내용을 복사해 주세요.', text);
    }
  }

  // key는 차수별 열쇠(활동명 | 차수 시작일). legacy는 차수 개념이 생기기 전
  // 활동명만으로 저장돼 있던 값으로, 확정을 풀 때는 그것도 같이 지워야 한다.
  // 안 지우면 풀었는데도 옛 기록 때문에 계속 확정으로 보인다.
  function toggleConfirm(key, on, legacy) {
    api({ code: code, action: on ? 'confirm' : 'unconfirm', nick: key }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        confirmed = r.data.confirmed || {};
        openDays = r.data.openDays || openDays;
        archived = r.data.archived || archived;
          trackOver = r.data.trackOverride || trackOver; candidates = r.data.candidates || candidates;
        if (!on && legacy) {
          return api({ code: code, action: 'unconfirm', nick: legacy }).then(function (r2) {
            if (r2.status === 200 && r2.data.ok) confirmed = r2.data.confirmed || {};
            renderList();
          });
        }
        renderList();
      } else {
        window.alert('처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      }
    }).catch(function () {
      window.alert('연결이 불안정합니다. 다시 시도해 주세요.');
    });
  }

  // ─── 목록 화면 ───
  // 차단된 접속 지점 — 있을 때만 나온다. 시간이 지나도 저절로 안 풀리므로
  // 담당자가 여기서 직접 풀어줘야 한다. 본인이 코드를 잊어 차단됐다면 그
  // 기기에서는 못 들어오니, 다른 기기(예: 휴대폰)로 들어와 풀면 된다.
  function blockedBox() {
    var keys = Object.keys(blocked);
    if (!keys.length) return '';
    return '<div class="blocked"><b>접근이 차단된 곳 ' + keys.length + '건</b>' +
      keys.map(function (ip) {
        return '<div class="blocked-row"><span>' + esc(ip) + '</span>' +
          '<span class="blocked-at">' + esc(fmtAt(blocked[ip].lastAt)) + ' · ' + esc(String(blocked[ip].fails)) + '회 실패</span>' +
          '<button class="mini" data-unblock="' + esc(ip) + '">차단 해제</button></div>';
      }).join('') +
      '<p class="blocked-note">모르는 곳이라면 누군가 코드를 찔러본 것입니다. 풀지 말고 그대로 두세요.</p></div>';
  }

  // ─── 오픈 날짜 관리 ───
  // 기본은 매달 첫 목요일이고, 그와 다른 달만 여기에 적어 둔다.
  // 적어 둔 값은 비공개 저장소에 저장되어 가이드 페이지의 달력·일정에 쓰인다.
  // 첫 목요일이 아닌 달. 가이드 화면(finalOption.jsx)에 적힌 것과 같은 값이다.
  // 관리 화면에는 이 목록이 없어 저장된 값이 비면 첫 목요일로 계산했고,
  // 10월 오픈을 10/1로 봐서 지급일이 일주일씩 당겨졌다.
  // 여기서 지정해 저장하면 저장된 값이 늘 먼저다.
  var OPEN_DAY_FALLBACK = { '2026-09': 10, '2026-10': 8 };

  function firstThursday(y, m) {   // m은 1부터
    var first = new Date(y, m - 1, 1);
    return 1 + ((4 - first.getDay() + 7) % 7);
  }

  // 인플 응대를 하는 기간 = 스토어 오픈일 D-7 ~ D+5. 그 밖은 쉬는 기간이라 열 때 자동 가져오기를 하지 않는다(버튼은 언제든 됨).
  // 서버 자동 가져오기도 같은 규칙이다 — 같은 값을 쓰는 곳: lib/open-window.js (기간 7일 전/5일 후, 오픈일 규칙은 위의 openDateFor와 같음)
  // 반환: { on: 지금 운영 기간인가, start/end: 해당 운영 기간(on일 때), next: 다음 운영 시작일(쉬는 중일 때) }
  function mailWindowInfo() {
    var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var opens = [];
    for (var i = -1; i <= 2; i++) {
      var yy = t.getFullYear(), mm = t.getMonth() + 1 + i;
      var y2 = yy + Math.floor((mm - 1) / 12), m2 = ((mm - 1) % 12 + 12) % 12 + 1;
      var key = y2 + '-' + String(m2).padStart(2, '0');
      var day = openDays[key]; if (day == null) day = OPEN_DAY_FALLBACK[key]; if (day == null) day = firstThursday(y2, m2);
      opens.push(new Date(y2, m2 - 1, +day));
    }
    var next = null;
    for (var j = 0; j < opens.length; j++) {
      var st = new Date(opens[j]); st.setDate(st.getDate() - 7);
      var en = new Date(opens[j]); en.setDate(en.getDate() + 5);
      if (t >= st && t <= en) return { on: true, start: st, end: en };
      if (st > t && (!next || st < next)) next = st;
    }
    return { on: false, next: next };
  }

  function monthKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // 이번 달부터 앞으로 다섯 달치를 보여준다. 지난 달은 이미 끝난 일정이라 뺀다.
  function openMonths() {
    var out = [];
    var d = new Date();
    d.setDate(1);
    for (var i = 0; i < 5; i++) {
      out.push(monthKey(d));
      d.setMonth(d.getMonth() + 1);
    }
    return out;
  }

  // 그 건이 어느 오픈 회차에 속하는지.
  //
  // 처음엔 '초안 날짜 이후로 가장 가까운 오픈일'로 봤는데, 오픈이 지난 뒤에
  // 초안을 주시는 경우(10월 8일 오픈인데 초안이 10월 15일)가 전부 다음 달
  // 회차로 밀려 지급일이 한 달씩 늦게 나왔다. 앞뒤를 가리지 않고 가장 가까운
  // 오픈일을 그 건의 회차로 본다.
  function openDateFor(draftDate) {
    var p = String(draftDate || '').split('-');
    if (p.length !== 3) return null;
    var y = +p[0], m = +p[1];
    var set = function (yy, mm) {
      var yy2 = yy + Math.floor((mm - 1) / 12);
      var mm2 = ((mm - 1) % 12 + 12) % 12 + 1;
      var key = yy2 + '-' + String(mm2).padStart(2, '0');
      var day = openDays[key];
      if (day == null) day = OPEN_DAY_FALLBACK[key];
      if (day == null) day = firstThursday(yy2, mm2);
      return new Date(yy2, mm2 - 1, day);
    };
    var draft = new Date(y, m - 1, +p[2]);
    var best = null, gap = Infinity;
    [m - 1, m, m + 1].forEach(function (mm) {
      var d = set(y, mm);
      var g = Math.abs(d - draft);
      if (g < gap) { gap = g; best = d; }
    });
    return best;
  }

  function plusDays(base, n) {
    var d = new Date(base); d.setDate(d.getDate() + n);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // 가이드 기준(06 보상 탭)
  //   선지급 — 오픈 후 10일차에 1차, 예약판매 정산(오픈일 D+40 전후)에 2차
  //   후지급 — 정산 때 한 번에
  function payPlan(r) {
    var open = openDateFor(r.draftDate);
    if (!open) return null;
    if (trackOf(r) === 'split') {
      return { first: plusDays(open, 10), second: plusDays(open, 40), open: plusDays(open, 0) };
    }
    return { first: null, second: plusDays(open, 40), open: plusDays(open, 0) };
  }

  // 다음 지급이 언제인지에 따라 칩 색을 나눈다.
  //   soon  이번 달 안   — 지금 챙길 것
  //   later 다음 달 이후 — 아직 멀었다
  //   done  이미 지났다
  // 색은 '며칠 남았는지'로 나눈다. 이번 달인지로 나눴더니 월말과 월초가 하루
  // 차이로 색이 뒤집혀, 같은 '곧'인데 달라 보였다.
  //   now   7일 이내 — 이번 주에 나간다
  //   left  아직 남음
  //   done  이미 지났다
  function payWhen(open, offset) {
    var d = new Date(open); d.setDate(d.getDate() + offset);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var days = Math.round((d - today) / 864e5);
    if (days < 0) return 'done';
    return days <= 7 ? 'now' : 'left';
  }

  // 다음에 나갈 지급이 언제인지(밀리초). 선지급은 1차가 지났으면 정산일이다.
  function nextPayTime(r) {
    var open = openDateFor(r.draftDate);
    if (!open) return Infinity;       // 날짜를 안 적은 건은 맨 뒤
    var d = new Date(open);
    d.setDate(d.getDate() + (trackOf(r) === 'split' && payWhen(open, 10) !== 'done' ? 10 : 40));
    return d.getTime();
  }

  // 가까운 지급끼리 한 묶음으로 본다. 9월 후지급과 10월 선지급처럼 며칠 차이로
  // 같이 나가는 건들이 목록에서 떨어져 있으면 두 번 일하게 된다.
  var GROUP_GAP_DAYS = 10;

  function payGroupLabel(t) {
    if (!isFinite(t)) return '날짜 미정';
    var d = new Date(t);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var days = Math.round((d - today) / 864e5);
    var when = (d.getMonth() + 1) + '/' + d.getDate();
    if (days < 0) return '지난 지급';
    if (days === 0) return when + ' 오늘 지급';
    // 며칠 뒤인지까지 적으면 숫자가 또 늘어난다. 급한 것만 말로 집어 준다.
    return days <= 7 ? (when + '부터 · 이번 주') : (when + '부터');
  }

  // 이 칸에는 '다음에 할 일' 한 줄만 둔다. 날짜 둘에 설명까지 쌓여 있으니
  // 정작 얼마를 언제 줘야 하는지가 묻혔다. 끝난 차수는 지급 확인 칸으로 뺀다.
  //   선지급 1차 전 — 10/18 · 1차 5만
  //   선지급 1차 후 — 11/17 · 2차 5만 (750↑)
  //   후지급        — 11/17 · 5만~10만 (정산 결과에 따라 갈려 미리 못 박는다)
  function payCell(r) {
    var p = payPlan(r);
    if (!p) return '<span class="pay-none">-</span>';
    var open = openDateFor(r.draftDate);

    if (trackOf(r) !== 'split') {
      return '<b class="paychip ' + payWhen(open, 40) + '">' + p.second + ' 주간 · 5만~10만</b>';
    }
    if (payWhen(open, 10) === 'done') {
      return '<b class="paychip ' + payWhen(open, 40) + '">' + p.second + ' 주간 · 2차 5만 <span class="pay-cond">(750↑)</span></b>';
    }
    return '<span class="pay">' +
      '<b class="paychip ' + payWhen(open, 10) + '">' + p.first + ' 주간 · 1차 5만</b>' +
      '<em>2차 ' + p.second + ' 주간 · 5만 (750↑)</em></span>';
  }

  // 1차가 이미 나간 건은 그 사실만 지급 확인 칸 밑에 작게 남긴다.
  function paidNote(r) {
    if (trackOf(r) !== 'split') return '';
    var open = openDateFor(r.draftDate);
    if (!open || payWhen(open, 10) !== 'done') return '';
    var p = payPlan(r);
    return '<span class="paid-note">1차 ' + p.first + ' 지급</span>';
  }

  function openBox() {
    var rows = openMonths().map(function (key) {
      var p = key.split('-');
      var base = OPEN_DAY_FALLBACK[key] == null ? firstThursday(+p[0], +p[1]) : OPEN_DAY_FALLBACK[key];
      var set = openDays[key];
      var day = set == null ? base : set;
      return '<div class="open-row' + (set == null ? '' : ' is-set') + '">' +
        '<span class="open-month">' + (+p[1]) + '월</span>' +
        '<select class="open-pick" data-month="' + esc(key) + '">' +
          Array.from({ length: new Date(+p[0], +p[1], 0).getDate() }, function (_, i) {
            var n = i + 1;
            return '<option value="' + n + '"' + (n === day ? ' selected' : '') + '>' + n + '일</option>';
          }).join('') +
        '</select>' +
        '<span class="open-note">' + (set == null
          ? '기본 (첫 목요일 ' + base + '일)'
          : '직접 지정함 · 기본은 ' + base + '일') + '</span>' +
        (set == null ? '' : '<button class="mini open-reset" data-month="' + esc(key) + '">기본으로</button>') +
        '</div>';
    }).join('');

    return '<details class="open-box fitw"><summary>오픈 날짜 관리 ' +
      '<span class="open-sum">기본은 매달 첫 목요일 · 다른 날이면 여기서 바꾸세요</span></summary>' +
      '<div class="open-list">' + rows + '</div>' +
      '<p class="open-foot" id="open-msg">바꾸면 가이드 페이지의 달력과 이벤트 일정에 바로 반영됩니다.</p>' +
      '</details>';
  }

  function saveOpenDay(month, day, msgEl) {
    if (msgEl) msgEl.textContent = '저장 중…';
    return api({ code: code, action: 'open-day', month: month, day: day })
      .then(function (r) {
        if (r.status === 200 && r.data.ok) {
          openDays = r.data.days || {};
          renderList();
          var m = document.getElementById('open-msg');
          if (m) m.textContent = '저장했습니다. 가이드 페이지에 바로 반영됩니다.';
        } else if (msgEl) {
          msgEl.textContent = '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
        }
      })
      .catch(function () { if (msgEl) msgEl.textContent = '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'; });
  }

  // 행의 상태를 셋으로 나눈다. 두 달 넘게 운영하니 지난 달 것과 이번 달 것이
  // 섞여 보여, '아직 볼 것'과 '이미 끝난 것'이 구분되지 않았다.
  //   ''        이번 달이고 날짜가 아직 안 지남 — 지금 챙길 건
  //   past      이번 달인데 날짜는 지남 — 마무리 확인이 남아 있을 수 있음
  //   oldmonth  지난 달 이전 — 끝난 회차
  function rowAge(r) {
    // 기준은 초안 날짜가 아니라 '마지막 지급 예정일'이다. 초안 날짜가 지났어도
    // 지급이 남아 있으면 아직 챙겨야 할 건이라 또렷하게 두고, 지급까지 끝난
    // 건만 가라앉힌다.
    var open = openDateFor(r.draftDate);
    if (!open) return '';
    var last = new Date(open); last.setDate(last.getDate() + 40);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return last < today ? 'done' : '';
  }

  // 지급 상태 — '' 진행 중 / 'part' 선지급 1차만 나감 / 'full' 다 나감
  // 예전에 저장된 기록은 stage가 없으므로 'full'로 본다.
  function payStage(r) {
    var a = archived[r.roundKey];
    if (!a) return '';
    return a.stage === 'part' ? 'part' : 'full';
  }
  function isArchived(r) { return payStage(r) === 'full'; }
  function isPartPaid(r) { return payStage(r) === 'part'; }
  // 목록에서 내려가는 건 두 상태 모두 — 다만 서로 다른 칸에 모인다.
  function isSettled(r) { return payStage(r) !== ''; }

  // 지금 적용되는 수령 방식. 담당자가 바꿨으면 그 값, 아니면 크리에이터가 낸 값.
  function trackOf(r) {
    var o = trackOver[r.roundKey];
    return (o && o.track) || r.track;
  }
  function trackChanged(r) {
    var o = trackOver[r.roundKey];
    return !!(o && o.track && o.track !== r.track);
  }

  function saveTrack(key, want) {
    api({ code: code, action: 'track', nick: key, track: want }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        trackOver = r.data.trackOverride || {};
        renderList();
      }
    });
  }

  // 고른 건의 차수 열쇠 목록. 같은 차수의 지난 제출은 한 묶음이라 한 번만 담긴다.
  function pickedKeys() {
    return Object.keys(picked).filter(function (k) { return picked[k]; });
  }

  // 고른 건이 있을 때만 나오는 아래쪽 띠. 한 번에 내리거나 되돌린다.
  function pickBar() {
    var keys = pickedKeys();
    if (!keys.length) return '';
    var allArchived = keys.every(function (k) { return archived[k]; });
    return '<div class="pickbar">' +
      '<span class="pickbar-n">' + keys.length + '건 선택</span>' +
      (allArchived
        ? '<button class="mini" id="unarch">목록으로 되돌리기</button>'
        : '<button class="mini is-main" id="arch">끝난 건으로 내리기</button>') +
      '<button class="mini" id="unpick">선택 해제</button>' +
      '</div>';
  }

  function saveArchive(on) {
    var keys = pickedKeys();
    if (!keys.length) return;
    var btn = document.getElementById(on ? 'arch' : 'unarch');
    if (btn) { btn.disabled = true; btn.textContent = '처리 중…'; }
    api({ code: code, action: on ? 'archive' : 'unarchive', keys: keys })
      .then(function (r) {
        if (r.status === 200 && r.data.ok) {
          archived = r.data.archived || {};
          picked = {};
          renderList();
        } else if (btn) { btn.disabled = false; btn.textContent = '다시 시도'; }
      })
      .catch(function () { if (btn) { btn.disabled = false; btn.textContent = '다시 시도'; } });
  }

  // 표 위에서 끌어 여러 줄을 한 번에 고른다. 지난 달 것을 정리할 때 한 줄씩
  // 누르면 수십 번을 눌러야 해서다. 누른 줄부터 끌고 간 줄까지가 고른 범위다.
  var drag = { on: false, paint: null };

  // 표 위에서 끌어 여러 줄을 한 번에 고른다. 지난 달 것을 정리할 때 한 줄씩
  // 누르면 수십 번을 눌러야 해서다. 누른 줄부터 끌고 간 줄까지가 고른 범위이고,
  // 이미 골라 둔 줄에서 시작하면 그 범위를 푼다.
  function bindDragPick(table) {
    var startIdx = -1, base = null;
    var trs = Array.prototype.slice.call(table.querySelectorAll('tbody tr'));
    var keyAt = function (i) { return trs[i] && trs[i].getAttribute('data-key'); };

    var paint = function (to) {
      var a = Math.min(startIdx, to), b = Math.max(startIdx, to);
      var next = {};
      Object.keys(base).forEach(function (k) { if (base[k]) next[k] = true; });
      var turnOff = !!base[keyAt(startIdx)];
      for (var i = a; i <= b; i++) {
        var k = keyAt(i);
        if (!k) continue;
        if (turnOff) delete next[k]; else next[k] = true;
      }
      picked = next;
      trs.forEach(function (tr) {
        var on = !!picked[tr.getAttribute('data-key')];
        tr.classList.toggle('is-picked', on);
        var box = tr.querySelector('.pick input');
        if (box) box.checked = on;
      });
    };
    drag.paint = paint;

    trs.forEach(function (tr, i) {
      tr.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        if (e.target.closest('button')) return;   // 확정 버튼 등은 그대로 눌리게
        // 줄 어디서나 끌 수 있게 했더니 글자를 긁어 복사할 수가 없었다.
        // 끌어서 고르는 것은 맨 앞 네모 칸에서만 시작한다.
        if (!e.target.closest('td.pick, th.pick')) return;
        drag.on = true; startIdx = i;
        document.body.classList.add('is-dragging');
        base = {};
        Object.keys(picked).forEach(function (k) { if (picked[k]) base[k] = true; });
        paint(i);
        e.preventDefault();                        // 글자가 파랗게 끌려가지 않게
      });
      tr.addEventListener('mouseenter', function () { if (drag.on) paint(i); });
    });
  }

  // 끌기를 놓는 곳은 표 밖일 수도 있어 문서 전체에서 받는다. 화면을 다시 그릴
  // 때마다 새로 달면 리스너가 쌓이므로 처음 한 번만 단다.
  document.addEventListener('mouseup', function () {
    if (!drag.on) return;
    drag.on = false;
    document.body.classList.remove('is-dragging');
    renderList();   // 아래 띠를 다시 그린다
  });

  // 표를 그린 뒤 그 폭을 재서 위쪽 상자들에 넣어 준다. 표만 넓고 상자는 짧으면
  // 세로선이 어긋나 보인다. 창 크기가 바뀌면 다시 잰다.
  function fitToTable() {
    var t = root.querySelector('table');
    if (!t) return;
    var w = Math.ceil(t.getBoundingClientRect().width);
    root.style.setProperty('--tablew', w + 'px');
  }
  window.addEventListener('resize', function () { fitToTable(); });

  // ─── 회차 현황 ─────────────────────────────────────────────
  // 왜 있나: 이전 회차 정산(오픈 +40일)과 이번 회차 초안이 같은 주에 몰리는데,
  // 접수 목록은 사람 단위라 '그 주에 무엇이 몇 건 겹치는지'가 안 보였다.
  // 새로 적는 칸 없이, 이미 있는 값(초안일·오픈일·업로드 확인·지급 표시)으로만 계산한다.

  // 한 사람(차수)이 지금 어느 단계인지. 다음 할 일과 그 날짜를 같이 돌려준다.
  //   draft   초안 대기       — 초안 예정일이 아직 안 옴
  //   upload  업로드 확인 필요 — 초안 예정일이 지났는데 업로드 확인 표시가 없음
  //   pay1    1차 지급 대기   — 선지급, 업로드 확인됨, 1차 아직
  //   settle  정산 대기       — 후지급이거나 1차가 나간 선지급
  //   done    완료            — 전액 지급 표시
  var STAGES = [
    { id: 'draft', label: '초안 대기' },
    { id: 'upload', label: '업로드 확인 필요' },
    { id: 'pay1', label: '1차 지급 대기' },
    { id: 'settle', label: '정산 대기' },
    { id: 'done', label: '완료' }
  ];
  var STAGE_LABEL = {};
  STAGES.forEach(function (x) { STAGE_LABEL[x.id] = x.label; });

  function dayStart(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  function parseDay(v) {
    var p = String(v || '').split('-');
    return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null;
  }

  function stageOf(r) {
    var st = payStage(r);
    var open = openDateFor(r.draftDate);
    var split = trackOf(r) === 'split';
    if (st === 'full') return { id: 'done', when: null };
    if (st === 'part') return { id: 'settle', when: open ? addDays(open, 40) : null };
    if (!isConfirmed(r)) {
      var draft = parseDay(r.draftDate);
      var today = dayStart(new Date());
      return { id: draft && draft < today ? 'upload' : 'draft', when: draft };
    }
    if (split) return { id: 'pay1', when: open ? addDays(open, 10) : null };
    return { id: 'settle', when: open ? addDays(open, 40) : null };
  }

  // 월요일 시작 주
  function weekOf(d) {
    var x = dayStart(d);
    return addDays(x, -((x.getDay() + 6) % 7));
  }

  var WEEKS_AHEAD = 10;  // 이번 주부터 몇 주를 보여줄지 — 정산(+40일)까지 들어오게

  function roundBox() {
    var list = visibleRows().filter(function (r) { return r.latest; });
    // 회차 = 그 건의 오픈일(가장 가까운 오픈일). 오픈일을 열쇠로 묶는다.
    var byRound = {};
    list.forEach(function (r) {
      var open = openDateFor(r.draftDate);
      var key = open ? monthKey(open) : 'none';
      (byRound[key] = byRound[key] || { key: key, open: open, rows: [] }).rows.push(r);
    });
    // 다 끝난 회차(전원 완료)는 뺀다. 지금 챙길 것만 남긴다.
    var rounds = Object.keys(byRound).sort().map(function (k) { return byRound[k]; })
      .filter(function (g) { return g.rows.some(function (r) { return stageOf(r).id !== 'done'; }); });

    if (!rounds.length) {
      return '<div class="empty">지금 진행 중인 회차가 없습니다.</div>';
    }

    // 주 칸: 맨 앞 '밀린 일' + 이번 주부터 WEEKS_AHEAD주
    var thisWeek = weekOf(new Date());
    var weeks = [];
    for (var i = 0; i < WEEKS_AHEAD; i++) weeks.push(addDays(thisWeek, i * 7));
    var colOf = function (d) {
      if (!d) return -2;                       // 날짜 미정 — 표에 안 넣는다
      var w = weekOf(d);
      if (w < thisWeek) return -1;             // 밀린 일
      var n = Math.round((w - thisWeek) / (7 * 864e5));
      return n < WEEKS_AHEAD ? n : -2;         // 너무 먼 일은 안 넣는다
    };

    // 회차 × 주 칸마다 할 일을 센다. 할 일 = 지금 단계의 다음 일.
    // (초안 대기는 '초안', 초안일이 지났는데 업로드 확인이 없으면 '업로드 확인')
    var KIND = { draft: '초안', upload: '업로드 확인', pay1: '1차 지급', settle: '정산' };
    var cells = {};      // roundKey|col → { 초안: n, ... }
    var colRounds = {};  // col → { roundKey: true } — 한 주에 몇 회차 일이 겹치는지
    rounds.forEach(function (g) {
      g.rows.forEach(function (r) {
        var s = stageOf(r);
        if (s.id === 'done') return;
        var c = colOf(s.when);
        if (c === -2) return;
        var ck = g.key + '|' + c;
        var kind = KIND[s.id];
        cells[ck] = cells[ck] || {};
        cells[ck][kind] = (cells[ck][kind] || 0) + 1;
        (colRounds[c] = colRounds[c] || {})[g.key] = true;
      });
    });
    var isClash = function (c) { return c >= 0 && Object.keys(colRounds[c] || {}).length >= 2; };

    var roundName = function (g) {
      if (g.key === 'none') return '날짜 미정';
      return (g.open.getMonth() + 1) + '월 회차';
    };

    // ① 주간 겹침표
    var head = '<tr><th class="rt-name">회차</th>' +
      '<th class="rt-col is-late">밀린 일</th>' +
      weeks.map(function (w, i) {
        return '<th class="rt-col' + (isClash(i) ? ' is-clash' : '') + (i === 0 ? ' is-now' : '') + '">' +
          md(w) + '~' + (i === 0 ? '<span class="rt-now">이번 주</span>' : '') +
          (isClash(i) ? '<span class="rt-clash">겹침</span>' : '') + '</th>';
      }).join('') + '</tr>';
    var body = rounds.map(function (g) {
      var openCol = g.open ? colOf(g.open) : -2;
      var cell = function (c) {
        var m = cells[g.key + '|' + c] || {};
        var KCLS = { '초안': 'draft', '업로드 확인': 'upload', '1차 지급': 'pay1', '정산': 'settle' };
        var chips = Object.keys(KCLS).filter(function (k) { return m[k]; }).map(function (k) {
          return '<span class="rt-chip k-' + KCLS[k] + '">' + k + ' ' + m[k] + '</span>';
        }).join('');
        if (c >= 0 && c === openCol) chips = '<span class="rt-open">오픈 ' + md(g.open) + '</span>' + chips;
        return '<td class="rt-col' + (c === -1 ? ' is-late' : '') + (isClash(c) ? ' is-clash' : '') + '">' + chips + '</td>';
      };
      return '<tr><th class="rt-name">' + esc(roundName(g)) +
        (g.open ? '<span class="rt-sub">오픈 ' + md(g.open) + ' · 정산 ' + md(addDays(g.open, 40)) + '</span>' : '') + '</th>' +
        cell(-1) + weeks.map(function (_, i) { return cell(i); }).join('') + '</tr>';
    }).join('');

    var grid = '<section class="rbox"><h2 class="rbox-h">주간 할 일</h2>' +
      '<p class="rbox-desc">칸 숫자는 그 주에 챙길 건수입니다. 두 회차 이상의 일이 같은 주에 몰리면 <b class="rt-clash">겹침</b>으로 표시됩니다.</p>' +
      '<div class="scroll"><table class="rtable"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></section>';

    // ② 회차별 크리에이터 단계
    var cards = rounds.map(function (g) {
      var sorted = g.rows.slice().sort(function (a, b) {
        var ia = STAGES.findIndex(function (x) { return x.id === stageOf(a).id; });
        var ib = STAGES.findIndex(function (x) { return x.id === stageOf(b).id; });
        if (ia !== ib) return ia - ib;
        return String(a.draftDate || '').localeCompare(String(b.draftDate || ''));
      });
      var count = {};
      g.rows.forEach(function (r) { var id = stageOf(r).id; count[id] = (count[id] || 0) + 1; });
      var summary = STAGES.filter(function (x) { return count[x.id]; }).map(function (x) {
        return '<span class="st-sum s-' + x.id + '">' + x.label + ' ' + count[x.id] + '</span>';
      }).join('');
      var lines = sorted.map(function (r) {
        var s = stageOf(r);
        var idx = STAGES.findIndex(function (x) { return x.id === s.id; });
        // 후지급은 1차 단계가 없다 — 그 점은 비워 둔다.
        var dots = STAGES.map(function (x, i) {
          var skip = x.id === 'pay1' && trackOf(r) !== 'split';
          var cls = skip ? 'skip' : (i < idx ? 'past' : (i === idx ? 'cur' : ''));
          if (x.id === 'upload' && s.id !== 'upload' && i < idx) cls = 'past';
          return '<i class="dot ' + cls + '" title="' + esc(x.label) + '"></i>';
        }).join('');
        return '<li class="st-row s-' + s.id + '">' +
          '<span class="st-nick">' + esc(r.nick) + '</span>' +
          '<span class="st-dots">' + dots + '</span>' +
          '<span class="st-label">' + esc(STAGE_LABEL[s.id]) + '</span>' +
          '<span class="st-when">' + (s.when && s.id !== 'done' ? md(s.when) : '') + '</span>' +
          '<span class="st-track">' + esc(TRACK[trackOf(r)] || '') + '</span>' +
          '</li>';
      }).join('');
      return '<section class="rcard"><div class="rcard-h"><b>' + esc(roundName(g)) + '</b>' +
        (g.open ? '<span class="rt-sub">오픈 ' + md(g.open) + ' · 1차 ' + md(addDays(g.open, 10)) + ' · 정산 ' + md(addDays(g.open, 40)) + '</span>' : '') +
        '</div><div class="rcard-sum">' + summary + '</div><ul class="st-list">' + lines + '</ul></section>';
    }).join('');

    return grid + '<div class="rcards">' + cards + '</div>' +
      '<p class="foot">단계는 접수 목록의 ‘업로드 확인’과 ‘리워드 지급’ 표시로 자동으로 바뀝니다. 이 화면에서 따로 입력할 것은 없습니다.<br />' +
      '전원 지급이 끝난 회차는 여기서 빠집니다.</p>';
  }

  // ─── 쿠폰 발급 목록 ────────────────────────────────────────
  // 왜 있나: 쿠폰 한 건 발급에 10분쯤 걸리는데, 그중 상당 부분이 접수 목록에서
  // 아이디·금액·상품을 찾아 옮겨 적는 시간이다. 지급할 차례가 된 건만 모아
  // 발급 화면에 넣을 값 그대로 보여주고, 표 복사·CSV로 꺼낼 수 있게 한다.
  // CSV는 나중에 브라우저 자동 입력에 그대로 넣을 입력값으로도 쓴다.
  //
  // 금액은 사람이 판단할 부분(2차 750↑ 여부, 후지급 정산 결과)을 확정하지 않는다.
  // 화면에는 '확인 필요'를 붙이고, CSV에는 그 조건 설명을 빼고 값만 넣는다.
  var COUPON_DAYS = 7;   // '이번 주까지' = 오늘부터 이 날짜 안에 지급할 것 + 밀린 것
  var couponRange = 'soon';   // 'soon' 이번 주까지 / 'all' 대기 전체 (화면에서만 쓰는 값)

  function couponItems() {
    var limit = addDays(dayStart(new Date()), COUPON_DAYS);
    return visibleRows().filter(function (r) { return r.latest; }).map(function (r) {
      var s = stageOf(r);
      if (s.id !== 'pay1' && s.id !== 'settle') return null;
      if (couponRange === 'soon' && !(s.when && s.when <= limit)) return null;
      var split = trackOf(r) === 'split';
      var goods = r.reward === 'goods';
      var turn = s.id === 'pay1' ? '1차' : (split ? '2차' : '전액');
      var amount, note;
      if (goods) { amount = ''; note = ''; }
      else if (turn === '1차') { amount = '5만'; note = ''; }
      else if (turn === '2차') { amount = '5만'; note = '750↑ 확인 필요'; }
      else { amount = '5만~10만'; note = '정산 후 확정'; }
      return {
        r: r, turn: turn, when: s.when, stage: s.id,
        type: goods ? '상품 쿠폰' : '금액 쿠폰',
        amount: amount, note: note, wish: goods ? (r.wish || '') : ''
      };
    }).filter(Boolean).sort(function (a, b) {
      return (a.when ? a.when.getTime() : Infinity) - (b.when ? b.when.getTime() : Infinity);
    });
  }

  var COUPON_HEAD = ['네이버 ID', '활동명', '차수', '쿠폰 유형', '금액', '상품', '지급 예정일'];
  // 엑셀·시트는 =, +, -, @ 로 시작하는 칸을 수식으로 실행한다. 희망 상품·아이디는
  // 크리에이터가 직접 쓴 글이라, 그대로 내보내면 열자마자 수식이 돌 수 있다.
  // 앞에 작은따옴표를 붙여 글자로만 읽히게 한다(표 복사·CSV 둘 다 이 함수를 지난다).
  function sheetSafe(v) {
    var t = String(v == null ? '' : v);
    return /^[=+\-@\t\r]/.test(t) ? "'" + t : t;
  }
  function couponRow(x) {
    return [x.r.naver || '', x.r.nick, x.turn, x.type, x.amount, x.wish, x.when ? md(x.when) : ''].map(sheetSafe);
  }

  function couponCopy(btn) {
    var lines = [COUPON_HEAD.join('\t')].concat(couponItems().map(function (x) { return couponRow(x).join('\t'); }));
    var text = lines.join('\n');
    var done = function () {
      btn.textContent = '복사됨'; btn.classList.add('is-done');
      setTimeout(function () { btn.textContent = '표 복사'; btn.classList.remove('is-done'); }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
    } else { fallback(text, done); }
  }

  function couponCsv() {
    var cell = function (v) {
      var t = String(v == null ? '' : v);
      return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    var lines = [COUPON_HEAD].concat(couponItems().map(couponRow)).map(function (row) { return row.map(cell).join(','); });
    // 엑셀이 한글을 깨뜨리지 않게 맨 앞에 BOM을 붙인다.
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    var t = new Date();
    a.href = URL.createObjectURL(blob);
    // 파일 이름은 영문으로 둔다. 한글 이름은 브라우저에 따라 'download'로 바뀌어 저장됐다.
    a.download = 'coupon-list-' + t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function couponBox() {
    var items = couponItems();
    var today = dayStart(new Date());
    var rowsHtml = items.map(function (x) {
      var late = x.when && x.when < today;
      return '<tr' + (late ? ' class="is-late"' : '') + '>' +
        '<td class="cp-id"><b>' + esc(x.r.naver || '-') + '</b></td>' +
        '<td>' + esc(x.r.nick) + '</td>' +
        '<td><span class="cp-turn">' + esc(x.turn) + '</span></td>' +
        '<td><span class="tag ' + esc(x.r.reward) + '">' + esc(x.type) + '</span></td>' +
        '<td class="cp-amt">' + (x.amount ? '<b>' + esc(x.amount) + '</b>' : '') +
          (x.wish ? '<b>' + esc(x.wish) + '</b>' : '') +
          (x.note ? '<span class="cp-note">' + esc(x.note) + '</span>' : '') + '</td>' +
        '<td class="cp-when">' + (x.when ? md(x.when) : '-') + (late ? '<span class="cp-late">지남</span>' : '') + '</td>' +
        '<td><button class="mini cp-pay" data-key="' + esc(x.r.roundKey) + '" data-stage="' + (x.stage === 'pay1' ? 'part' : 'full') + '">' +
          (x.stage === 'pay1' ? '1차 지급함' : '지급 완료') + '</button></td>' +
        '</tr>';
    }).join('');
    return '<section class="rbox">' +
      '<div class="cp-bar">' +
        '<div class="seg" role="group">' +
          '<button class="seg-b' + (couponRange === 'soon' ? ' is-on' : '') + '" data-range="soon">이번 주까지</button>' +
          '<button class="seg-b' + (couponRange === 'all' ? ' is-on' : '') + '" data-range="all">대기 전체</button>' +
        '</div>' +
        '<span class="cp-n">' + items.length + '건</span>' +
        '<span class="cp-sp"></span>' +
        '<button class="mini" id="cp-copy"' + (items.length ? '' : ' disabled') + '>표 복사</button>' +
        '<button class="mini" id="cp-csv"' + (items.length ? '' : ' disabled') + '>CSV 내려받기</button>' +
      '</div>' +
      '<p class="cp-warn">⚠ 네이버 ID(개인정보)가 들어 있습니다. 내려받은 파일·복사한 표는 공유 범위에 주의해 주세요.</p>' +
      (items.length
        ? '<div class="scroll"><table class="cptable"><thead><tr>' +
          '<th>네이버 ID</th><th>활동명</th><th>차수</th><th>쿠폰 유형</th><th>금액 / 상품</th><th>지급 예정일</th><th></th>' +
          '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
        : '<div class="empty">' + (couponRange === 'soon' ? '이번 주까지 지급할 건이 없습니다.' : '지급을 기다리는 건이 없습니다.') + '</div>') +
      '</section>' +
      '<p class="foot">업로드 확인이 된 건만 이 목록에 들어옵니다. 발급을 마치면 오른쪽 버튼을 눌러 주세요 — 접수 목록의 ‘리워드 지급’ 표시와 같은 값이라 양쪽에 함께 반영됩니다.<br />' +
      '2차(750↑ 여부)와 후지급(정산 결과) 금액은 확인 후 발급해 주세요. CSV에는 이 조건 설명 없이 값만 들어갑니다.</p>';
  }

  // ─── 확정 후보 ─────────────────────────────────────────────
  // 후보 탐색·팀 의견·탈락 기록은 노션에서 하고, 최종 확정된 분만 여기로 가져온다.
  // 가져온 뒤에는 접수 목록과 활동명으로 자동으로 이어져, '아직 접수 전인지 / 어느
  // 단계인지'가 보인다. 연락 이력(메일 추출 파일 반영)은 자리만 잡아 두었다.
  function candKey(name) { return String(name || '').toLowerCase().replace(/\s+/g, ''); }

  // 노션 표를 복사해 붙여넣으면 한 줄이 한 사람이다. 탭으로 나뉘어 오거나(노션 복사),
  // | 로 나뉘어 온다(마크다운 표). 칸 위치는 이렇게 찾는다.
  //   · 머리글 줄에 '이름' 칸이 있으면 그 칸을 활동명으로 쓴다.
  //   · 머리글이 없으면 :ins: 같은 아이콘 글자·주소·빈 칸을 건너뛴 첫 칸을 쓴다.
  // 활동명은 "바보개구리 (kekero_kr)" 꼴이므로 괄호 앞까지만 취한다(괄호 안은 계정 아이디).
  function cleanCandName(raw) {
    return String(raw || '').replace(/\*\*|__/g, '').replace(/\s*[(（].*$/, '').replace(/^@/, '').trim();
  }
  function parseCandidates(text) {
    var nameIdx = -1, out = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var cells;
      if (line.indexOf('\t') >= 0) cells = line.split('\t');
      else if (line.indexOf('|') >= 0) {
        cells = line.split('|');
        if (!cells[0].trim()) cells.shift();
        if (cells.length && !cells[cells.length - 1].trim()) cells.pop();
      } else cells = [line];
      cells = cells.map(function (c) { return c.trim(); });
      // 구분선(| --- | --- |)은 건너뛴다
      if (cells.every(function (c) { return !c || /^:?-{2,}:?$/.test(c); })) return;
      var h = cells.indexOf('이름');
      if (h >= 0) { nameIdx = h; return; }   // 머리글 줄
      var link = '';
      cells.forEach(function (c) { if (!link && /^https?:\/\//i.test(c)) link = c; });
      var raw = nameIdx >= 0 ? cells[nameIdx] : cells.filter(function (c) {
        return c && !/^https?:\/\//i.test(c) && !/^:[^:\s]+:$/.test(c);
      })[0];
      var name = cleanCandName(raw);
      if (name) out.push({ name: name, link: link });
    });
    return out;
  }

  function candStatus(name) {
    var k = candKey(name);
    var hit = withLatestFlag(rows).filter(function (r) { return r.latest && candKey(r.nick) === k; })
      .sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); })[0];
    if (!hit) return { done: false, text: '접수 전' };
    var s = stageOf(hit);
    return { done: true, text: '접수됨 · ' + STAGE_LABEL[s.id] + (s.when && s.id !== 'done' ? ' ' + md(s.when) : '') };
  }

  function candBox() {
    var names = Object.keys(candidates).sort(function (a, b) {
      return String(candidates[b].at || '').localeCompare(String(candidates[a].at || ''));
    });
    var waiting = names.filter(function (n) { return !candStatus(n).done; }).length;
    var rowsHtml = names.map(function (n) {
      var st = candStatus(n);
      var c = candidates[n] || {};
      return '<tr>' +
        '<td class="cd-name"><b>' + esc(n) + '</b></td>' +
        '<td>' + (/^https?:\/\//i.test(c.link || '') ? '<a class="cd-link" href="' + esc(c.link) + '" target="_blank" rel="noopener noreferrer">열기</a>' : '<span class="cd-none">-</span>') + '</td>' +
        '<td><span class="cd-st' + (st.done ? ' is-done' : '') + '">' + esc(st.text) + '</span></td>' +
        '<td class="cd-mail">' + mailStatusFor(n) + '</td>' +
        '<td><button class="mini cd-del" data-name="' + esc(n) + '">삭제</button></td>' +
        '</tr>';
    }).join('');
    return '<section class="rbox">' +
      '<h2 class="rbox-h">확정 후보 가져오기</h2>' +
      '<p class="rbox-desc">노션에서 최종 확정된 분들의 표를 복사해 붙여넣어 주세요. 한 줄이 한 분이고, 활동명과 링크를 읽어 옵니다. 이미 있는 활동명은 건너뜁니다.</p>' +
      '<textarea class="cd-paste" id="cd-paste" rows="4" placeholder="여기에 붙여넣기 (예: 활동명 ⇥ 인스타 주소)"></textarea>' +
      '<div class="cd-act"><button class="mini is-main" id="cd-add">가져오기</button><span class="cd-msg" id="cd-msg"></span></div>' +
      '</section>' +
      '<section class="rbox">' +
      '<div class="cp-bar"><b>확정 후보</b><span class="cp-n">' + names.length + '명' + (waiting ? ' · 접수 전 ' + waiting + '명' : '') + '</span></div>' +
      (names.length
        ? '<div class="scroll"><table class="cptable cdtable"><thead><tr>' +
          '<th>활동명</th><th>링크</th><th>접수 현황</th><th>연락 이력</th><th></th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
        : '<div class="empty">아직 가져온 후보가 없습니다.</div>') +
      '</section>' +
      '<p class="foot">후보 탐색과 팀 의견, 탈락 기록은 노션에서 합니다. 이 화면에는 최종 확정된 분만 가져옵니다.<br />' +
      '‘접수 현황’은 크리에이터가 접수 폼을 제출하면 활동명이 같은 건과 자동으로 이어집니다.<br />' +
      '‘연락 이력’ 탭에서 메일을 가져오면 이 칸이 채워집니다.</p>';
  }

  // ─── 연락 이력 (메일 추출 파일 읽기) ───────────────────────────
  // 담당자가 올린 일간 메일 추출 파일을 이 브라우저에서만 읽어 크리에이터별로 정리한다.
  // 메일 내용은 서버로 보내지도 어디에 저장하지도 않는다(새로고침하면 사라진다). AI도 쓰지 않고,
  // 날짜·주소·인사말의 모양이라는 정해진 규칙으로만 읽는다. 샘플 4건으로 확인한 구조를 따른다.
  //   · 한 메일 안에 지난 대화가 인용으로 이어져 있어, 한 통에서 대화 전체를 복원한다.
  //   · 제목이 FW: 로 시작하는 최신 메일은 담당자가 전달한 것이라 이력에서 뺀다(안의 원본만 쓴다).
  //   · 발신자 표시 이름은 활동명과 다를 수 있어 쓰지 않는다. 활동명은 보낸 메일의
  //     "안녕하세요, ○○님", 받은 메일의 "○○입니다"에서 읽는다.
  var MY_MAIL_RE = /@presenceworld\.co\.kr$/i;
  var GREET_RE = /안녕하세요[,.!]?\s*([^\s,!.]{1,12}(?: [^\s,!.]{1,12})?)\s*님/;
  var INTRO_STOP = { '것': 1, '저': 1, '제': 1, '점': 1, '때': 1, '이': 1 };

  var MAIL_BODY_ERR = {

    'mail-gone': '메일함에서 이 메일을 찾지 못했습니다. 이동하거나 삭제했을 수 있습니다.',

  // 답장 초안 — 이 브라우저에만 저장한다(서버·깃허브로 보내지 않음). 크리에이터 단위로 한 개.

      return '<button class="ml-dr-btn' + (txt ? ' has' : '') + '" data-dr="' + esc(key) + '">' +
        (txt ? '✎ 쓰던 답장 있음 — ' + esc(head.slice(0, 24)) + (head.length > 24 ? '…' : '') : '✎ 답장 쓰기') + '</button>';
    }
    return '<div class="ml-dr"><textarea data-drt="' + esc(key) + '" placeholder="여기에 답장을 써 두세요. 이 브라우저에 자동 저장됩니다(메일로 보내지지는 않습니다).">' + esc(txt) + '</textarea>' +
      '<div class="ml-dr-f"><button class="mini" data-drc="' + esc(key) + '">복사</button><button class="mini" data-drx="' + esc(key) + '">지우기</button>' +
      '<button class="mini" data-dr="' + esc(key) + '">접기</button><span>이 브라우저에만 저장됩니다</span></div></div>';
  }

  function mailLoad(ref) {
    var k = mailRefKey(ref);
    if (mailBody[k] && mailBody[k].state !== 'err') return;
    mailBody[k] = { state: 'loading' };
    api({ code: code, action: 'mail-body', folder: ref.folder, uidv: ref.uidv, uid: ref.uid }).then(function (r) {
      var d = r.data || {};
      mailBody[k] = (r.status === 200 && d.ok) ? { state: 'ok', d: d } : { state: 'err', msg: MAIL_BODY_ERR[d.reason] || MAIL_ERR[d.reason] || '본문을 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.' };
      if (mailOpen[k]) renderList();
    }).catch(function () { mailBody[k] = { state: 'err', msg: '본문을 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.' }; if (mailOpen[k]) renderList(); });
  }
  function mailToggleBody(ref) {
    var k = mailRefKey(ref);
    if (mailOpen[k]) { delete mailOpen[k]; renderList(); return; }
    mailOpen[k] = true;
    mailLoad(ref);
    renderList();
  }
  function mailBodyHtml(ref) {
    var b = mailBody[mailRefKey(ref)];
    if (!b || b.state === 'loading') return '<div class="ml-body is-wait">메일함에서 읽어오는 중…</div>';
    if (b.state === 'err') return '<div class="ml-body is-err">' + esc(b.msg) + '</div>';
    var d = b.d;
    var att = (d.attachments || []).length ? '<div class="ml-att">첨부 ' + d.attachments.length + '개: ' + d.attachments.map(function (a) {
      return esc(a.name) + (a.size ? ' (' + (a.size >= 1048576 ? (a.size / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(a.size / 1024)) + 'KB') + ')' : '');
    }).join(', ') + '</div>' : '';
    return '<div class="ml-body"><div class="ml-body-h">' + esc(d.from || '') + ' → ' + esc((d.to || []).join(', ')) + '</div>' +
      '<pre>' + esc(d.text || '(본문이 비어 있습니다)') + '</pre>' + att +
      '<div class="ml-body-f">' + (d.hadQuote ? '지난 대화 인용은 생략했습니다. ' : '') + (d.truncated ? '긴 메일이라 앞부분만 보여줍니다. ' : '') + '이 화면의 내용은 저장되지 않습니다.</div></div>';
  }

  // 저장된 이력 지우기(메일함의 메일은 그대로). 두 번 눌러야 실행된다.
  var purgeArmed = '';
  function mailPurge(mode) {
    if (mailSync.busy) return;
    mailSync.busy = true;
    mailSync.note = '저장된 이력을 지우는 중…';
    renderList();
    var body = { code: code, action: 'mail-purge', mode: mode };
    if (mode === 'older') body.days = 14;
    api(body).then(function (r) {
      var d = r.data || {};
      mailSync.busy = false;
      if (r.status === 200 && d.ok) {
        mailSync.note = (mode === 'all' ? '저장된 이력을 전부 지웠습니다(' + d.removed + '건). 다음 [메일 가져오기]는 처음처럼 최근 50일부터 가져옵니다.'
          : '14일보다 오래된 이력 ' + d.removed + '건을 지웠습니다(남은 이력 ' + d.kept + '건).') + ' 저장소의 현재 파일에서 지운 것이고, 깃허브의 과거 기록에는 남아 있을 수 있습니다.';
        mailSync.autoTried = true;   // 지운 직후에 자동으로 다시 가져오지 않는다
        loadMailEvents(true);
      } else {
        mailSync.note = '지우지 못했습니다. 잠시 후 다시 시도해 주세요.';
      }
      renderList();
    }).catch(function () { mailSync.busy = false; mailSync.note = '지우지 못했습니다. 잠시 후 다시 시도해 주세요.'; renderList(); });
  }

  function mailWindowText() {
    var w = mailWindowInfo();
    if (w.on) return '자동 가져오기: <b>켜짐</b> — 운영 기간 ' + md(w.start) + ' ~ ' + md(w.end) + ' (스토어 오픈일 기준 D-7 ~ D+5)';
    return '자동 가져오기: <b>쉬는 중</b>' + (w.next ? ' — 다음 운영 기간은 ' + md(w.next) + '부터' : '') + '. 지금 새 메일이 필요하면 [메일 가져오기]를 눌러 주세요.';
  }
  function mailSyncPanel() {
    var when = mailSync.syncedAt ? (function (d) {
      return md(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    })(new Date(mailSync.syncedAt)) : null;
    var dis = (mailSync.busy || !mailSync.configured) ? ' disabled' : '';
    return '<section class="rbox"><h2 class="rbox-h">메일함에서 가져오기</h2>' +
      '<p class="rbox-desc">웍스 메일에서 정해 둔 폴더만 읽습니다. 읽음 표시·이동·삭제는 하지 않고, 본문은 저장하지 않습니다(날짜·보낸이·활동명·제목만 비공개 저장소에 남깁니다).</p>' +
      '<p class="ml-fresh">' + (mailSync.configured
        ? (when ? '마지막으로 가져온 시각: ' + esc(when) : '아직 가져온 적이 없습니다. 아래 [메일 가져오기]를 누르면 지난 50일치를 가져옵니다.')
        : '메일 접속 설정이 아직 없어 가져올 수 없습니다. 아래 ‘파일로 올리기’는 그대로 쓸 수 있습니다.') + '</p>' +
      '<p class="ml-fresh">' + mailWindowText() + '</p>' +
      '<div class="cd-act">' +
      '<button class="mini is-main" id="ms-sync"' + dis + '>메일 가져오기</button>' +
      '<button class="mini" id="ms-folders"' + dis + '>폴더 확인</button>' +
      '</div>' +
      '<div class="ml-old"><span>저장된 이력 지우기:</span>' +
        '<button class="mini mp-btn" data-mp="older"' + dis + '>' + (purgeArmed === 'older' ? '한 번 더 누르면 지웁니다' : '14일보다 오래된 이력 지우기') + '</button>' +
        '<button class="mini mp-btn" data-mp="all"' + dis + '>' + (purgeArmed === 'all' ? '한 번 더 누르면 전부 지웁니다' : '전체 초기화') + '</button></div>' +
      '<div class="ml-old"><span>빠진 예전 메일 채우기:</span>' + [14, 50, 100, 200, 400].map(function (n) { return '<button class="mini ms-old" data-days="' + n + '"' + dis + '>' + n + '일 전까지</button>'; }).join('') + '</div>' +
      (mailSync.note ? '<p class="ml-fresh" id="ms-note" style="margin-top:8px">' + esc(mailSync.note) + '</p>' : '') +
      '<ul class="ml-help">' +
      '<li><b>메일 가져오기</b> — 지난번 이후 새로 온 메일만 가져옵니다. 처음 누르면 지난 50일치를 가져오고, 많으면 알아서 이어서 가져옵니다.</li>' +
      '<li><b>빠진 예전 메일 채우기</b> — 평소에는 누를 필요 없습니다. 더 오래된 협업 메일이 필요할 때만, 오늘부터 몇 일 전까지 거슬러 올라갈지 골라 누르세요(기간이 길수록 오래 걸립니다).</li>' +
      '<li><b>자동 가져오기</b> — 스토어 오픈일 7일 전부터 5일 뒤까지(인플 응대 기간)만 켜져 있습니다. 그 기간에는 매일 밤 23시 무렵 서버가 알아서 가져오고, 이 화면을 열었을 때 마지막으로 가져온 지 5시간이 넘었으면 한 번 더 가져옵니다. 쉬는 기간에는 위 [메일 가져오기]를 눌러야만 가져옵니다.</li>' +
      '<li><b>저장된 이력 지우기</b> — 이 보드에 쌓아 둔 연락 이력(날짜·주소·이름·제목)만 지웁니다. 메일함의 메일은 그대로이고, 지운 이력은 다시 가져오면 돌아옵니다. 깃허브의 과거 기록에는 지우기 전 내용이 남을 수 있습니다. 내가 써 둔 답장 초안은 이 브라우저에 따로 있어 지워지지 않습니다.</li>' +
      '<li><b>폴더 확인</b> — 설정한 폴더를 찾을 수 있는지만 봅니다. 메일은 읽지 않습니다.</li>' +
      '</ul>' +
      '</section>';
  }

  function mailDirText(d) { return d === '보냄' ? '내가 보냄' : '상대가 보냄'; }
  function mailTurnText(it) {
    if (it.turn === 'me') return '내가 답할 차례 ' + (it.days ? it.days + '일째' : '오늘');
    if (it.turn === 'ok') return '답장 안 해도 될 듯 ' + (it.days ? it.days + '일째' : '오늘');
    return it.days ? it.days + '일째 기다리는 중' : '오늘 보냄';
  }
  // 확정 후보 표의 '연락 이력' 칸
  function mailStatusFor(name) {
    if (!mailInfo) return '‘연락 이력’ 탭에서 메일을 가져오면 표시';
    var k = candKey(name), hit = null;
    mailInfo.list.forEach(function (it) { if (!hit && candKey(it.name) === k) hit = it; });
    return hit ? '<span class="ml-turn ' + hit.turn + '">' + esc(mailTurnText(hit)) + '</span>' : '메일에서 못 찾음';
  }

  // 오래된 파일을 올리면 '내가 답할 차례'가 이미 답한 건까지 포함해 틀린 정보가 된다.
  // 파일만 올렸을 때는 그 안의 가장 최근 메일 시각을 보여주고, 하루 넘게 지났으면 눈에 띄게 알린다.
  // 메일함에서 가져온 경우에는 경고하지 않는다 — 새 메일이 없어서 오래돼 보일 수 있고, 얼마나 최신인지는
  // 위쪽의 '마지막으로 끝까지 가져온 시각'이 알려준다.
  function mailFreshHtml() {
    var d = mailInfo && mailInfo.latest;
    if (!d) return '';
    var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (mailEvents.length) return '<p class="ml-fresh">가져온 메일 중 가장 최근: ' + md(d) + ' ' + hh + '</p>';
    var hours = Math.floor((Date.now() - d.getTime()) / 36e5);
    var stale = hours >= 24;
    return '<p class="ml-fresh' + (stale ? ' is-stale' : '') + '">이 파일에서 가장 최근 메일: ' + md(d) + ' ' + hh +
      (stale ? ' — ' + Math.floor(hours / 24) + '일 전 파일입니다. 그 뒤에 답장한 건은 반영되지 않아, ‘답 대기’ 일수가 실제와 다를 수 있습니다.' : ' (' + (hours < 1 ? '방금' : hours + '시간 전') + ')') + '</p>';
  }

  function mailBox() {
    var known = {};
    Object.keys(candidates).forEach(function (n) { known[candKey(n)] = '확정 후보'; });
    withLatestFlag(rows).forEach(function (r) { if (r.latest && !known[candKey(r.nick)]) known[candKey(r.nick)] = '접수됨'; });
    var up = mailSyncPanel() + '<section class="rbox"><h2 class="rbox-h">파일로 올리기 (예비)</h2>' +
      '<p class="rbox-desc">메일함 가져오기가 어렵거나 더 오래된 메일이 필요할 때, 메일 추출 파일(.md)을 올리거나 붙여넣어 주세요. 이 브라우저에서만 읽고, 서버로 보내거나 저장하지 않습니다. 새로고침하면 사라집니다.</p>' +
      '<div class="cd-act"><label class="mini is-main" for="ml-file">파일 고르기</label>' +
      '<input type="file" id="ml-file" accept=".md,.txt,text/markdown,text/plain" multiple hidden />' +
      '<span class="cd-msg" id="ml-msg"></span></div>' +
      '<textarea class="cd-paste" id="ml-paste" rows="3" placeholder="또는 여기에 붙여넣기" style="margin-top:8px"></textarea>' +
      '<div class="cd-act"><button class="mini" id="ml-read">붙여넣은 내용 읽기</button></div></section>';
    if (!mailInfo) return up + '<p class="foot">파일을 올리면 크리에이터별로 ‘답 대기 며칠째’와 ‘최근 메일 제목’이 정리됩니다.</p>';

    var range = mailRange();
    var shown = range ? mailInfo.list.filter(function (it) { return it.days <= range; }) : mailInfo.list;
    var hidden = mailInfo.list.length - shown.length;
    var rangeBar = '<div class="ml-old"><span>보기:</span><select id="ml-range" aria-label="연락 이력 보기 기간">' + MAIL_RANGES.map(function (n) {
      return '<option value="' + n + '"' + (n === range ? ' selected' : '') + '>' + (n ? '최근 ' + n + '일 안에 연락한 사람' : '전체') + '</option>';
    }).join('') + '</select>' + (hidden ? '<span>기간 밖 ' + hidden + '명은 숨겼습니다(삭제한 게 아니라 보기만 줄인 것입니다)</span>' : '') + '</div>';
    var rowsHtml = shown.map(function (it) {
      var link = known[candKey(it.name)];
      var subs = it.subs.map(function (s) {
        var label = esc(s.title) + ' <i>' + md(s.date) + ' ' + mailDirText(s.dir) + '</i>';
        if (!s.ref) return '<span class="ml-sub" title="' + esc(s.title) + '">' + label + '</span>';
        var open = !!mailOpen[mailRefKey(s.ref)];
        return '<button class="ml-sub ml-sub-btn' + (open ? ' is-open' : '') + '" data-ml="' + esc(JSON.stringify(s.ref)) + '" title="눌러서 본문 보기">' + (open ? '▾ ' : '▸ ') + label + '</button>' +
          (open ? mailBodyHtml(s.ref) : '');
      }).join('');
      return '<tr>' +
        '<td class="cd-name"><b' + (it.nameFromDisplay ? ' title="인사말이 없어 메일의 보낸이 표시 이름을 썼습니다"' : '') + '>' + esc(it.name) + '</b>' + (it.nameFromDisplay ? '<span class="ml-guess">표시 이름</span>' : '') + (it.addr && it.addr !== it.name ? '<span class="ml-addr">' + esc(it.addr) + (it.moreAddrs ? ' 외 ' + it.moreAddrs + '개' : '') + '</span>' : '') + '</td>' +
        '<td><span class="ml-turn ' + it.turn + '">' + esc(mailTurnText(it)) + '</span>' + (it.turn === 'ok' ? '<span class="ml-hint">마지막 메일이 확인·감사 인사뿐으로 보여요. 내용을 눌러 확인해 보세요.</span>' : '') + (draftGet(draftKey(it)) ? '<span class="ml-hint">✎ 쓰던 답장 있음</span>' : '') + '</td>' +
        '<td class="ml-last">' + md(it.last.date) + ' ' + mailDirText(it.last.dir) + (it.last.fa ? '<span class="ml-addr">보낸이 ' + esc(it.last.fa) + '</span>' : '') + '</td>' +
        '<td>' + subs + draftHtml(it) + '</td>' +
        '<td>' + (link ? '<span class="cd-st is-done">' + esc(link === '접수됨' ? '접수함' : link) + '</span>' : '<span class="cd-none">접수 안 함</span>') + '</td>' +
        '</tr>';
    }).join('');
    var notes = [];
    if (mailInfo.fw) notes.push('제목이 FW:로 시작하는 ' + mailInfo.fw + '통은 전달한 메일이라 이력에서 뺐습니다.');
    if (mailInfo.unclassified) notes.push('누구의 메일인지 정하지 못한 메시지가 ' + mailInfo.unclassified + '개 있습니다.');
    return up + '<section class="rbox">' +
      '<div class="cp-bar"><b>연락 이력</b><span class="cp-n">메일 ' + mailInfo.mails + '통 → 메시지 ' + mailInfo.msgs + '개 → ' + shown.length + '명</span></div>' + rangeBar +
      mailFreshHtml() +
      (shown.length
        ? '<div class="scroll"><table class="mltable"><thead><tr><th>활동명</th><th>지금 할 일</th><th>마지막 메일</th><th>주고받은 메일 (제목을 누르면 본문)</th><th>접수 여부</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
        : '<div class="empty">' + (hidden ? '이 기간에는 연락한 사람이 없습니다. 위에서 보기 기간을 늘려 보세요.' : '읽을 수 있는 메일을 찾지 못했습니다. 추출 파일 형식이 맞는지 확인해 주세요.') + '</div>') +
      '</section>' +
      '<p class="foot">' + notes.join('<br />') + (notes.length ? '<br />' : '') +
      '<b>지금 할 일</b> — “내가 답할 차례”는 마지막 메일을 <b>상대가 보냈다</b>는 뜻입니다. 짧은 확인·감사 인사(질문·부탁이 없는 것)는 “답장 안 해도 될 듯”으로 따로 나뉘어 맨 아래로 갑니다 — 글자만 보고 판단하므로 틀릴 수 있어 내용을 눌러 확인하세요. “기다리는 중”은 마지막 메일을 <b>내가 보냈다</b>는 뜻입니다.<br />' +
      '<b>접수 여부</b> — 크리에이터가 접수 폼을 냈으면 “접수함”, 확정 후보에 넣어 두었으면 “확정 후보”, 둘 다 아니면 “접수 안 함”입니다. 활동명이 다르게 적혀 있으면 이어지지 않을 수 있습니다.<br />' +
      '활동명은 보낸 메일의 “안녕하세요, ○○님”, 받은 메일의 “○○입니다”에서 읽고, 둘 다 없으면 메일의 보낸이 표시 이름을 씁니다(“표시 이름” 표시). 같은 활동명이 주소만 달라도 한 사람으로 묶습니다.</p>';
  }

  function viewTabs() {
    return '<div class="tabs" role="tablist">' + Object.keys(VIEWS).map(function (k) {
      return '<button class="tab' + (view === k ? ' is-on' : '') + '" role="tab" aria-selected="' + (view === k) + '" data-view="' + k + '">' + VIEWS[k] + '</button>';
    }).join('') + '</div>';
  }

  function renderList() {
    if ((view === 'mail' || view === 'cand') && !mailSync.loaded) loadMailEvents();

    var groupCount = {};

      // 목록이 사람 수만큼만 길어진다.
      return r.latest || openRounds[r.roundKey];
    }).map(function (r) {
      var isOn = isConfirmed(r);
      var age = rowAge(r);
      var on = !!picked[r.roundKey];
      // 지급일 순으로 볼 때만, 가까운 지급끼리 머리줄로 묶어 준다.
      var head = '';
      // 1차만 지급 / 지급 완료 구간에도 구분 줄을 넣는다. 회색끼리 붙어 있어
      // 어디부터가 끝난 건인지 눈으로 잡히지 않았다.
      if (r.latest && isSettled(r)) {

          head = '<tr class="grouprow is-settled"><td colspan="12">' +
            '<span class="group-when">' + (st === 'part' ? '1차만 지급함' : '지급 완료') + '</span>' +
            '<span class="group-n">' + (st === 'part' ? partCount : doneCount) + '건</span></td></tr>';
          lastSettled = st;
        }
      }
      if (sortBy === 'pay' && r.latest && !isSettled(r)) {
        var t = nextPayTime(r);
        if (lastGroupAt === null || !isFinite(t) !== !isFinite(lastGroupAt) ||
            (isFinite(t) && t - lastGroupAt > GROUP_GAP_DAYS * 864e5)) {
          var same = list.filter(function (x) {
            if (!x.latest || isSettled(x)) return false;
            var xt = nextPayTime(x);
            return isFinite(t) ? (isFinite(xt) && Math.abs(xt - t) <= GROUP_GAP_DAYS * 864e5) : !isFinite(xt);
          }).length;
          head = '<tr class="grouprow"><td colspan="12">' +
            '<span class="group-when">' + esc(payGroupLabel(t)) + '</span>' +
            '<span class="group-n">' + same + '건</span></td></tr>';
          lastGroupAt = t;
        }
      }
      var cls = (r.latest ? '' : 'is-old') +

        (isArchived(r) ? ' is-archived' : '') + (isPartPaid(r) ? ' is-part' : '') +
        (on ? ' is-picked' : '');
      return head + '<tr class="' + cls.trim() + '" data-key="' + esc(r.roundKey) + '">' +
        '<td class="pick"><input type="checkbox"' + (on ? ' checked' : '') + ' aria-label="고르기" /></td>' +
        '<td class="nick" title="' + esc(r.nick) + '">' + (r.latest

                '<span class="old-arrow">›</span><span class="nick-name">' + esc(r.nick) + '</span>' +
                '<span class="old-n">+' + oldCount[r.roundKey] + '</span></button>'
              : '<span class="nick-name">' + esc(r.nick) + '</span>')
          : '<span class="old-child">↳ <span class="nick-name">' + esc(r.nick) + '</span></span>') + '</td>' +
        '<td class="naver" title="' + esc(r.naver || '') + '"><span class="roll"><span>' + esc(r.naver || '-') + '</span></span></td>' +
        '<td class="draft' + (isOn ? ' is-uploaded' : '') + '">' + esc(fmtDate(r.draftDate)) + '</td>' +
        '<td><span class="dday' + ddayClass(r.draftDate) + '">' + esc(fmtDday(r.draftDate)) + '</span></td>' +
        '<td class="trackcell">' + (r.latest
          ? '<button class="tag tag-btn ' + esc(trackOf(r)) + '" data-track="' + esc(r.roundKey) + '" data-now="' + esc(trackOf(r)) + '" data-orig="' + esc(r.track) + '" title="눌러서 바꾸기">' +
            esc(TRACK[trackOf(r)] || trackOf(r)) + '</button>' +
            (trackChanged(r) ? '<span class="track-note" title="담당자가 바꿈 · 원래 ' + esc(TRACK[r.track] || r.track) + '">원래 ' + esc(TRACK[r.track] || r.track) + '</span>' : '')
          : '<span class="tag ' + esc(trackOf(r)) + '">' + esc(TRACK[trackOf(r)] || trackOf(r)) + '</span>') + '</td>' +
        '<td class="paycell">' + payCell(r) + '</td>' +
        '<td><span class="tag ' + esc(r.reward) + '">' + esc(REWARD[r.reward] || r.reward) + '</span></td>' +
        '<td class="wish" title="' + esc(r.wish || '') + '"><span class="roll"><span>' + esc(r.wish || '-') + '</span></span></td>' +
        '<td>' + esc(fmtAt(r.at)) + '</td>' +
        '<td>' + (r.latest
          ? '<button class="mini' + (isOn ? ' is-done' : '') + '" data-nick="' + esc(r.roundKey) + '" data-legacy="' + esc(confirmed[r.nick] ? r.nick : '') + '" data-on="' + (isOn ? '1' : '0') + '">' +
            (isOn ? '✓ 확인함' : '업로드 확인') + '</button>'
          : '') + '</td>' +
        '<td>' + (r.latest
          ? (function () {
              var st = payStage(r);

                ' data-reward="' + esc(r.roundKey) + '" data-next="' + next + '"' +
                ' title="' + (split ? '누를 때마다 1차 지급 → 전액 지급 → 해제' : '누르면 지급 완료, 다시 누르면 해제') + '">' +
                label + '</button>';
            })() + paidNote(r)
          : '') + '</td>' +
        '</tr>';
    }).join('');

    root.innerHTML =
      '<div class="wrap">' +
      '<div class="head fitw"><h1>인플루언서 보드</h1>' +
      '<span class="count">진행 ' + liveRows.length + '건' +
      (partCount ? ' · 1차만 지급 ' + partCount + '건' : '') +
