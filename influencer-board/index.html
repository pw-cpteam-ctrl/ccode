    if (copyBtn) copyBtn.addEventListener('click', function () { copyTable(this); });
    Array.prototype.forEach.call(root.querySelectorAll('.tab'), function (b) {
      b.addEventListener('click', function () {
        view = b.getAttribute('data-view');
        try { localStorage.setItem(VIEW_KEY, view); } catch (e) { /* 저장 못 해도 이번엔 바뀐다 */ }
        renderList();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.seg-b'), function (b) {
      b.addEventListener('click', function () { couponRange = b.getAttribute('data-range'); renderList(); });
    });
    var cpCopy = document.getElementById('cp-copy');
    if (cpCopy) cpCopy.addEventListener('click', function () { couponCopy(cpCopy); });
    var cpCsv = document.getElementById('cp-csv');
    if (cpCsv) cpCsv.addEventListener('click', couponCsv);
    if (view === 'settle') bindSettle();
    if (view === 'outreach') bindOutreach();
    var tabsEl = root.querySelector('.tabs'), tabOn = root.querySelector('.tab.is-on');
    if (tabsEl && tabOn) tabsEl.scrollLeft = tabOn.offsetLeft - (tabsEl.clientWidth - tabOn.offsetWidth) / 2;
    Array.prototype.forEach.call(root.querySelectorAll('.ml-sub-btn'), function (b) {
      b.addEventListener('click', function () {
        var ref = null;
        try { ref = JSON.parse(b.getAttribute('data-ml')); } catch (e) { /* 무시 */ }
        if (ref) mailToggleBody(ref);
      });
      // 마우스를 올려 0.35초 머물면 미리 불러와 둔다(누를 때 기다리는 시간을 줄이려고). 화면에는 안 보이고 저장도 안 된다.
      var hv = null;
      b.addEventListener('pointerenter', function (ev) {
        if (ev.pointerType === 'touch') return;
        hv = setTimeout(function () { try { var r = JSON.parse(b.getAttribute('data-ml')); if (r) mailLoad(r); } catch (e) { /* 무시 */ } }, 350);
      });
      b.addEventListener('pointerleave', function () { clearTimeout(hv); });
    });
    var msSync = document.getElementById('ms-sync'), msFolders = document.getElementById('ms-folders');
    if (msSync) msSync.addEventListener('click', function () { mailSyncRun('mail-sync'); });
    Array.prototype.forEach.call(document.querySelectorAll('.ms-old'), function (b) {
      b.addEventListener('click', function () { mailSyncRun('mail-sync', Number(b.getAttribute('data-days'))); });
    });
    // 답장 입력칸: 입력할 때마다 이 브라우저에 저장(화면은 다시 그리지 않아 커서가 안 튄다)
    Array.prototype.forEach.call(document.querySelectorAll('[data-dr]'), function (b) {
      b.addEventListener('click', function () { var k = b.getAttribute('data-dr'); draftOpen[k] = !draftOpen[k]; renderList(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-drt]'), function (t) {
      t.addEventListener('input', function () { draftSet(t.getAttribute('data-drt'), t.value); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-drc]'), function (b) {
      b.addEventListener('click', function () {
        var v = draftGet(b.getAttribute('data-drc'));
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function () { b.textContent = '복사됨'; }, function () { b.textContent = '복사 실패'; });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-drx]'), function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-drx');
        if (draftGet(k) && !b.getAttribute('data-sure')) { b.setAttribute('data-sure', '1'); b.textContent = '한 번 더 누르면 지움'; return; }
        draftSet(k, ''); renderList();
      });
    });
    if (msFolders) msFolders.addEventListener('click', function () { mailSyncRun('mail-folders'); });
    Array.prototype.forEach.call(document.querySelectorAll('.mp-btn'), function (b) {
      b.addEventListener('click', function () {
        var m = b.getAttribute('data-mp');
        if (purgeArmed !== m) { purgeArmed = m; renderList(); setTimeout(function () { if (purgeArmed === m) { purgeArmed = ''; renderList(); } }, 5000); return; }
        purgeArmed = '';
        mailPurge(m);
      });
    });
    var mlRange = document.getElementById('ml-range');
    if (mlRange) mlRange.addEventListener('change', function () { mailRangeSet(Number(mlRange.value)); renderList(); });
    var mlFile = document.getElementById('ml-file');
    if (mlFile) mlFile.addEventListener('change', function () {
      var files = Array.prototype.slice.call(mlFile.files || []);
      if (!files.length) return;
      Promise.all(files.map(function (f) {
        return f.text ? f.text() : new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(String(r.result)); }; r.onerror = no; r.readAsText(f); });
      })).then(function (texts) {
        var pr = parseMailExport(texts.join('\n'));
        mailFileMsgs = pr.msgs; mailFileMeta = { mails: pr.mails, fw: pr.fw };
        rebuildMailInfo();
        mailMsg = pr.mails ? files.length + '개 파일을 읽었습니다.' : '읽을 수 있는 메일을 찾지 못했습니다. 추출 파일 형식이 맞는지 확인해 주세요.';
        renderList();
      }).catch(function () { document.getElementById('ml-msg').textContent = '파일을 읽지 못했습니다.'; });
    });
    var mlRead = document.getElementById('ml-read');
    if (mlRead) mlRead.addEventListener('click', function () {
      var t = document.getElementById('ml-paste').value;
      if (!t.trim()) { document.getElementById('ml-msg').textContent = '붙여넣은 내용이 없습니다.'; return; }
      var pr = parseMailExport(t);
      mailFileMsgs = pr.msgs; mailFileMeta = { mails: pr.mails, fw: pr.fw };
      rebuildMailInfo();
      mailMsg = pr.mails ? '붙여넣은 내용을 읽었습니다.' : '읽을 수 있는 메일을 찾지 못했습니다. 추출 파일 형식이 맞는지 확인해 주세요.';
      renderList();
    });
    if (mailMsg) { var mm = document.getElementById('ml-msg'); if (mm) mm.textContent = mailMsg; mailMsg = ''; }
    var cdAdd = document.getElementById('cd-add');
    if (cdAdd) cdAdd.addEventListener('click', function () {
      var msg = document.getElementById('cd-msg');
      var items = parseCandidates(document.getElementById('cd-paste').value);
      if (!items.length) { msg.textContent = '붙여넣은 내용에서 활동명을 찾지 못했습니다.'; return; }
      cdAdd.disabled = true; msg.textContent = '가져오는 중…';
      api({ code: code, action: 'cand-add', items: items }).then(function (r) {
        if (r.status === 200 && r.data.ok) {
          candidates = r.data.candidates || candidates;
          candMsg = r.data.added + '명을 가져왔습니다' + (items.length - r.data.added ? ' (이미 있는 ' + (items.length - r.data.added) + '명은 건너뜀)' : '') + '.';
          renderList();
        } else { cdAdd.disabled = false; msg.textContent = '가져오지 못했습니다. 잠시 후 다시 시도해 주세요.'; }
      }).catch(function () { cdAdd.disabled = false; msg.textContent = '가져오지 못했습니다. 잠시 후 다시 시도해 주세요.'; });
    });
    if (candMsg) { var cm = document.getElementById('cd-msg'); if (cm) cm.textContent = candMsg; candMsg = ''; }
    Array.prototype.forEach.call(root.querySelectorAll('.cd-del'), function (b) {
      b.addEventListener('click', function () {
        // 손이 미끄러져 지우지 않도록 두 번 눌러야 지워진다.
        if (b.getAttribute('data-ask') !== '1') {
          b.setAttribute('data-ask', '1'); b.textContent = '한 번 더 누르면 삭제';
          setTimeout(function () { b.removeAttribute('data-ask'); b.textContent = '삭제'; }, 3000);
          return;
        }
        b.disabled = true; b.textContent = '삭제 중…';
        api({ code: code, action: 'cand-remove', nick: b.getAttribute('data-name') }).then(function (r) {
          if (r.status === 200 && r.data.ok) { candidates = r.data.candidates || {}; renderList(); }
          else { b.disabled = false; b.textContent = '다시 시도'; }
        }).catch(function () { b.disabled = false; b.textContent = '다시 시도'; });
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.cp-pay'), function (b) {
      b.addEventListener('click', function () {
        b.disabled = true; b.textContent = '처리 중…';
        api({ code: code, action: 'archive', keys: [b.getAttribute('data-key')], stage: b.getAttribute('data-stage') })
          .then(function (r) {
            if (r.status === 200 && r.data.ok) { archived = r.data.archived || {}; renderList(); }
            else { b.disabled = false; b.textContent = '다시 시도'; }
          }).catch(function () { b.disabled = false; b.textContent = '다시 시도'; });
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.old-toggle'), function (b) {
      b.addEventListener('mousedown', function (e) { e.stopPropagation(); });  // 끌어서 고르기와 겹치지 않게
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var k = b.getAttribute('data-round');
        if (openRounds[k]) delete openRounds[k]; else openRounds[k] = true;
        renderList();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.tag-btn'), function (b) {
      b.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var now = b.getAttribute('data-now');
        var next = now === 'split' ? 'after' : 'split';
        // 크리에이터가 낸 값으로 돌아온 것이면 바꾼 기록 자체를 지운다.
        saveTrack(b.getAttribute('data-track'), next === b.getAttribute('data-orig') ? '' : next);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('th.sortable'), function (th) {
      th.addEventListener('click', function () {
        sortBy = th.getAttribute('data-sort');
        try { localStorage.setItem(SORT_KEY, sortBy); } catch (e) { /* 저장 못 해도 이번엔 적용된다 */ }
        renderList();
      });
    });
    fitToTable();
    var tbl = view === 'list' ? root.querySelector('table') : null;
    if (tbl) bindDragPick(tbl);
    Array.prototype.forEach.call(root.querySelectorAll('.reward-btn'), function (b) {
      b.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var next = b.getAttribute('data-next');
        b.disabled = true; b.textContent = '처리 중…';
        api({ code: code, action: next ? 'archive' : 'unarchive',
              keys: [b.getAttribute('data-reward')], stage: next || undefined })
          .then(function (r) {
            if (r.status === 200 && r.data.ok) { archived = r.data.archived || {}; renderList(); }
            else { b.disabled = false; b.textContent = '다시 시도'; }
          }).catch(function () { b.disabled = false; b.textContent = '다시 시도'; });
      });
    });
    var arch = document.getElementById('arch');
    if (arch) arch.addEventListener('click', function () { saveArchive(true); });
    var unarch = document.getElementById('unarch');
    if (unarch) unarch.addEventListener('click', function () { saveArchive(false); });
    var unpick = document.getElementById('unpick');
    if (unpick) unpick.addEventListener('click', function () { picked = {}; renderList(); });
    // 오픈 날짜 — 고르면 바로 저장하고, '기본으로'를 누르면 목록에서 지운다.
    var openMsg = document.getElementById('open-msg');
    Array.prototype.forEach.call(root.querySelectorAll('.open-pick'), function (sel) {
      sel.addEventListener('change', function () {
        saveOpenDay(sel.getAttribute('data-month'), Number(sel.value), openMsg);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.open-reset'), function (b) {
      b.addEventListener('click', function () {
        saveOpenDay(b.getAttribute('data-month'), '', openMsg);
      });
    });
    // 칸보다 긴 아이디만 골라 흐르게 한다. 넘치는 만큼만 움직이면 되므로
    // 그 거리를 재서 넣어주고, 100px당 2초 정도로 속도를 맞춘다.
    Array.prototype.forEach.call(root.querySelectorAll('td.naver .roll, td.wish .roll'), function (roll) {
      var over = roll.firstChild.scrollWidth - roll.clientWidth;
      if (over <= 1) return;
      roll.classList.add('is-long');
      roll.style.setProperty('--roll-x', '-' + over + 'px');
      roll.style.setProperty('--roll-sec', Math.max(4, Math.round(over / 50)) + 's');
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-unblock]'), function (b) {
      b.addEventListener('click', function () {
        var who = b.getAttribute('data-unblock');
        b.disabled = true; b.textContent = '해제 중…';
        api({ code: code, action: 'unblock', ip: who }).then(function (r) {
          if (r.status === 200 && r.data.ok) { blocked = r.data.blocked || {}; renderList(); }
          else { b.disabled = false; b.textContent = '다시 시도'; }
        }).catch(function () { b.disabled = false; b.textContent = '다시 시도'; });
      });
    });
    document.getElementById('lock').addEventListener('click', function () {
      forgetCode(); code = ''; rows = []; confirmed = {}; blocked = {}; keyword = '';
      mailOpen = {}; mailBody = {};
      mailEvents = []; mailFileMsgs = []; mailInfo = null; mailSync = { loaded: false, syncedAt: null, configured: false, busy: false, note: '' };
      renderGate('');
    });
    document.getElementById('reload').addEventListener('click', function () {
      api({ code: code, action: 'list' }).then(function (r) {
        if (r.status === 200 && r.data.ok) {
          rows = r.data.rows || [];
          confirmed = r.data.confirmed || {};
        openDays = r.data.openDays || openDays;
        archived = r.data.archived || archived;
          trackOver = r.data.trackOverride || trackOver; candidates = r.data.candidates || candidates;
          renderList();
        }
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('button[data-nick]'), function (b) {
      b.addEventListener('click', function () {
        toggleConfirm(b.getAttribute('data-nick'), b.getAttribute('data-on') !== '1', b.getAttribute('data-legacy'));
      });
    });
  }

  // 기억해 둔 코드가 있으면 입력 화면을 건너뛴다.
  var saved = recallCode();
  if (saved) {
    root.innerHTML = '<div class="gate"><div class="gate-card"><p class="gate-desc">불러오는 중…</p></div></div>';
    api({ code: saved, action: 'list' }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        code = saved;
        rows = r.data.rows || [];
        confirmed = r.data.confirmed || {};
        openDays = r.data.openDays || openDays;
        archived = r.data.archived || archived;
          trackOver = r.data.trackOverride || trackOver; candidates = r.data.candidates || candidates;
        blocked = r.data.blocked || {};
        renderList();
      } else if (r.status === 429) {
        // 기억해 둔 코드는 맞을 가능성이 높다. 잠금이 풀리면 그대로 들어갈 수
        // 있으므로 여기서는 지우지 않는다.
        renderGate('여러 번 틀린 기록이 있어 잠시 잠겼습니다. 약 ' + (r.data.minutes || 10) + '분 후에 다시 열어주세요.');
      } else if (r.status === 403) {
        forgetCode();
        renderGate('너무 여러 번 틀려서 접근이 차단되었습니다. 관리자에게 문의해 주세요.');
      } else if (repoMsg(r.data.reason)) {
        // 코드는 맞으니 기억해 둔 코드는 지우지 않는다
        renderGate(repoMsg(r.data.reason));
      } else {
        forgetCode();
        renderGate(r.status === 401 ? '접속 코드가 변경되었습니다. 새 코드를 입력해 주세요.' : '');
      }
    }).catch(function () { renderGate(''); });
  } else {
    renderGate('');
  }
})();
</script>
</body>
</html>
