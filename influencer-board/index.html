      (view !== 'list' ? '' :
      '<p class="sub">같은 분이 <b>' + ROUND_GAP_DAYS + '일 안에</b> 다시 내신 것은 고쳐 내신 것으로 보고 <b>마지막 제출</b>만 유효합니다(지난 제출은 흐리게 표시). ' +
      '그보다 간격이 벌어지면 <b>다른 차수</b>로 보고 각각 따로 남습니다 — 같은 분과 달마다 협업하는 경우를 위해서입니다.</p>') +

      '<input class="search" id="q" type="search" placeholder="활동명으로 찾기" value="' + esc(keyword) + '" />' +
      (view === 'list' ? '<button class="mini" id="copy">표 전체 복사</button>' : '') +
      '<button class="mini" id="reload">새로고침</button>' +

      (list.length

      (view !== 'list' ? '' : '<p class="foot fitw">‘표 전체 복사’는 최신 제출만 담습니다. 노션 표에 그대로 붙여넣을 수 있어요.<br />' +
      '이 기기에서는 2일간 코드를 다시 묻지 않습니다. 공용 PC라면 ‘잠그기’를 눌러주세요.<br />' +

    var arch = document.getElementById('arch');
    if (arch) arch.addEventListener('click', function () { saveArchive(true); });
    var unarch = document.getElementById('unarch');
    if (unarch) unarch.addEventListener('click', function () { saveArchive(false); });
    var unpick = document.getElementById('unpick');
    if (unpick) unpick.addEventListener('click', function () { picked = {}; renderList(); });
    // 오픈 날짜 — 고르면 바로 저장하고, '기본으로'를 누르면 목록에서 지운다.
    var openMsg = document.getElementById('open-msg');
    Array.prototype.forEach.call(root.querySelectorAll('.open-pick'), function (sel) {
      sel.addEventListener('change', function () {
        saveOpenDay(sel.getAttribute('data-month'), Number(sel.value), openMsg);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.open-reset'), function (b) {
      b.addEventListener('click', function () {
        saveOpenDay(b.getAttribute('data-month'), '', openMsg);
      });
    });
    // 칸보다 긴 아이디만 골라 흐르게 한다. 넘치는 만큼만 움직이면 되므로
    // 그 거리를 재서 넣어주고, 100px당 2초 정도로 속도를 맞춘다.
    Array.prototype.forEach.call(root.querySelectorAll('td.naver .roll, td.wish .roll'), function (roll) {
      var over = roll.firstChild.scrollWidth - roll.clientWidth;
      if (over <= 1) return;
      roll.classList.add('is-long');
      roll.style.setProperty('--roll-x', '-' + over + 'px');
      roll.style.setProperty('--roll-sec', Math.max(4, Math.round(over / 50)) + 's');
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-unblock]'), function (b) {
      b.addEventListener('click', function () {
        var who = b.getAttribute('data-unblock');
        b.disabled = true; b.textContent = '해제 중…';
        api({ code: code, action: 'unblock', ip: who }).then(function (r) {
          if (r.status === 200 && r.data.ok) { blocked = r.data.blocked || {}; renderList(); }
          else { b.disabled = false; b.textContent = '다시 시도'; }
        }).catch(function () { b.disabled = false; b.textContent = '다시 시도'; });
      });
    });
    document.getElementById('lock').addEventListener('click', function () {
      forgetCode(); code = ''; rows = []; confirmed = {}; blocked = {}; keyword = '';
      mailOpen = {}; mailBody = {};
      mailEvents = []; mailFileMsgs = []; mailInfo = null; mailSync = { loaded: false, syncedAt: null, configured: false, busy: false, note: '' };
      renderGate('');
    });
    document.getElementById('reload').addEventListener('click', function () {
      api({ code: code, action: 'list' }).then(function (r) {
        if (r.status === 200 && r.data.ok) {
          rows = r.data.rows || [];
          confirmed = r.data.confirmed || {};
        openDays = r.data.openDays || openDays;
        archived = r.data.archived || archived;
          trackOver = r.data.trackOverride || trackOver; candidates = r.data.candidates || candidates;
          renderList();
        }
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('button[data-nick]'), function (b) {
      b.addEventListener('click', function () {
        toggleConfirm(b.getAttribute('data-nick'), b.getAttribute('data-on') !== '1', b.getAttribute('data-legacy'));
      });
    });
  }

  // 기억해 둔 코드가 있으면 입력 화면을 건너뛴다.
  var saved = recallCode();
  if (saved) {
    root.innerHTML = '<div class="gate"><div class="gate-card"><p class="gate-desc">불러오는 중…</p></div></div>';
    api({ code: saved, action: 'list' }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        code = saved;
        rows = r.data.rows || [];
        confirmed = r.data.confirmed || {};
        openDays = r.data.openDays || openDays;
        archived = r.data.archived || archived;
          trackOver = r.data.trackOverride || trackOver; candidates = r.data.candidates || candidates;
        blocked = r.data.blocked || {};
        renderList();
      } else if (r.status === 429) {
        // 기억해 둔 코드는 맞을 가능성이 높다. 잠금이 풀리면 그대로 들어갈 수
        // 있으므로 여기서는 지우지 않는다.
        renderGate('여러 번 틀린 기록이 있어 잠시 잠겼습니다. 약 ' + (r.data.minutes || 10) + '분 후에 다시 열어주세요.');
      } else if (r.status === 403) {
        forgetCode();
        renderGate('너무 여러 번 틀려서 접근이 차단되었습니다. 관리자에게 문의해 주세요.');
      } else if (repoMsg(r.data.reason)) {
        // 코드는 맞으니 기억해 둔 코드는 지우지 않는다
        renderGate(repoMsg(r.data.reason));
      } else {
        forgetCode();
        renderGate(r.status === 401 ? '접속 코드가 변경되었습니다. 새 코드를 입력해 주세요.' : '');
      }
    }).catch(function () { renderGate(''); });
  } else {
    renderGate('');
  }
})();
</script>
</body>
</html>
