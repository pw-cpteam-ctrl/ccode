<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>뱃지 임시 조정 도구 (박제 후 삭제 예정)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/S-CoreDream/S-CoreDream.css"/>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0ede7;color:#252018;padding:24px;}
h1{font-size:18px;margin:0 0 4px;}
p.desc{font-size:12px;color:#7d7568;margin:0 0 20px;}
.wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
#stage{border:1px solid #ddd8ce;border-radius:8px;background:#e8e5de;position:relative;overflow:hidden;}
#previewCanvas{display:block;}
#controls{width:340px;display:flex;flex-direction:column;gap:10px;font-size:12px;}
#controls fieldset{border:1px solid #ddd8ce;border-radius:8px;padding:10px 12px;}
#controls legend{font-size:12px;font-weight:bold;padding:0 4px;}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.row label{flex:0 0 110px;color:#555;}
.row input[type=range]{flex:1;}
.row input[type=number],.row input[type=text]{width:70px;}
.row .val{width:44px;text-align:right;color:#7d7568;}
select{font-size:12px;}
#output{width:100%;font-size:11px;font-family:monospace;height:130px;white-space:pre;background:#faf9f6;border:1px solid #ddd8ce;border-radius:6px;padding:8px;}
button{font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid #ccc4b4;background:#fff;cursor:pointer;}
button.primary{background:#252018;color:#fff;border-color:#252018;}
</style>
</head>
<body>
<h1>뱃지 임시 조정 도구</h1>
<p class="desc">이 페이지는 배지 위치·크기·글자 크기를 실시간으로 조정해서 값을 확정하기 위한 임시 도구입니다.
값이 정해지면 batch-merge.html에 그대로 반영하고 이 페이지는 삭제합니다. 팀원용 화면이 아닙니다.</p>

<div class="wrap">
  <div id="stage">
    <canvas id="previewCanvas" width="1080" height="1350" style="width:340px;height:425px;"></canvas>
  </div>

  <div id="controls">
    <fieldset>
      <legend>테스트 값</legend>
      <div class="row"><label>월</label><input type="number" id="tMonth" min="1" max="12" value="7"/></div>
      <div class="row"><label>스토어명</label><input type="text" id="tStore" value="PW 메가하우스 공식스토어" style="width:100%;"/></div>
      <div class="row"><label>뱃지 위치</label>
        <select id="tSide"><option value="left" selected>왼쪽</option><option value="right">오른쪽</option></select>
      </div>
      <div class="row"><label>글자 굵기</label>
        <select id="tWeight">
          <option value="100">100 Thin</option><option value="200">200 ExtraLight</option>
          <option value="300">300 Light</option><option value="400">400 Regular</option>
          <option value="500">500 Medium</option><option value="600">600 Bold</option>
          <option value="700" selected>700 ExtraBold</option><option value="800">800 Heavy</option>
          <option value="900">900 Black</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>뱃지 위치/크기</legend>
      <div class="row"><label>X 오프셋</label><input type="range" id="tOffX" min="-50" max="200" value="0"/><span class="val" id="vOffX">0</span></div>
      <div class="row"><label>Y 오프셋</label><input type="range" id="tOffY" min="-50" max="200" value="0"/><span class="val" id="vOffY">0</span></div>
      <div class="row"><label>폭(bw)</label><input type="range" id="tBw" min="100" max="500" value="260"/><span class="val" id="vBw">260</span></div>
      <div class="row"><label>높이(bh)</label><input type="range" id="tBh" min="100" max="500" value="240"/><span class="val" id="vBh">240</span></div>
      <div class="row"><label>노치 깊이</label><input type="range" id="tNotch" min="0" max="200" value="48"/><span class="val" id="vNotch">48</span></div>
      <div class="row"><label>모서리 둥글기</label><input type="range" id="tRadius" min="0" max="60" value="14"/><span class="val" id="vRadius">14</span></div>
    </fieldset>

    <fieldset>
      <legend>글자 크기/위치 (뱃지 안)</legend>
      <div class="row"><label>"07" 크기</label><input type="range" id="tF1Size" min="20" max="140" value="68"/><span class="val" id="vF1Size">68</span></div>
      <div class="row"><label>"07" Y위치</label><input type="range" id="tF1Y" min="0" max="240" value="92"/><span class="val" id="vF1Y">92</span></div>
      <div class="row"><label>"신제품" 크기</label><input type="range" id="tF2Size" min="10" max="80" value="34"/><span class="val" id="vF2Size">34</span></div>
      <div class="row"><label>"신제품" Y위치</label><input type="range" id="tF2Y" min="0" max="240" value="130"/><span class="val" id="vF2Y">130</span></div>
    </fieldset>

    <fieldset>
      <legend>스토어명 글자</legend>
      <div class="row"><label>크기</label><input type="range" id="tStoreSize" min="10" max="80" value="30"/><span class="val" id="vStoreSize">30</span></div>
      <div class="row"><label>가장자리 여백</label><input type="range" id="tStoreMargin" min="0" max="100" value="24"/><span class="val" id="vStoreMargin">24</span></div>
    </fieldset>

    <div style="display:flex;gap:8px;">
      <button class="primary" id="btnCopy">현재 값 복사</button>
      <button id="btnReset">기본값으로 리셋</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>
</div>

<script>
const CW = 1080, CH = 1350;
const $ = s => document.querySelector(s);
const canvas = $('#previewCanvas');
const ctx = canvas.getContext('2d');

function roundedPolyPath(ctx, pts, radii){
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const prev = pts[(i - 1 + n) % n];
    const cur = pts[i];
    const next = pts[(i + 1) % n];
    const r = Array.isArray(radii) ? radii[i] : radii;
    if (!r) {
      if (i === 0) ctx.moveTo(cur.x, cur.y); else ctx.lineTo(cur.x, cur.y);
      continue;
    }
    const v1x = prev.x - cur.x, v1y = prev.y - cur.y;
    const v2x = next.x - cur.x, v2y = next.y - cur.y;
    const len1 = Math.hypot(v1x, v1y), len2 = Math.hypot(v2x, v2y);
    const d = Math.min(r, len1 / 2, len2 / 2);
    const a1x = cur.x + (v1x / len1) * d, a1y = cur.y + (v1y / len1) * d;
    const a2x = cur.x + (v2x / len2) * d, a2y = cur.y + (v2y / len2) * d;
    if (i === 0) ctx.moveTo(a1x, a1y); else ctx.lineTo(a1x, a1y);
    ctx.quadraticCurveTo(cur.x, cur.y, a2x, a2y);
  }
  ctx.closePath();
}

const DEFAULTS = {
  offX: 0, offY: 0, bw: 260, bh: 240, notch: 48, radius: 14,
  f1Size: 68, f1Y: 92, f2Size: 34, f2Y: 130,
  storeSize: 30, storeMargin: 24
};

function getVals(){
  return {
    month: $('#tMonth').value, store: $('#tStore').value,
    side: $('#tSide').value, weight: Number($('#tWeight').value),
    offX: Number($('#tOffX').value), offY: Number($('#tOffY').value),
    bw: Number($('#tBw').value), bh: Number($('#tBh').value),
    notch: Number($('#tNotch').value), radius: Number($('#tRadius').value),
    f1Size: Number($('#tF1Size').value), f1Y: Number($('#tF1Y').value),
    f2Size: Number($('#tF2Size').value), f2Y: Number($('#tF2Y').value),
    storeSize: Number($('#tStoreSize').value), storeMargin: Number($('#tStoreMargin').value)
  };
}

function draw(){
  const v = getVals();
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#f4f2ee';
  ctx.fillRect(0, 0, CW, CH);

  const bw = v.bw, bh = v.bh, notch = v.notch;
  const flatH = bh - notch;

  ctx.save();
  const badgeX = v.side === 'left' ? v.offX : CW - bw - v.offX;
  ctx.translate(badgeX, v.offY);
  ctx.fillStyle = '#ffd400';
  ctx.beginPath();
  roundedPolyPath(ctx, [
    { x: 0, y: 0 },
    { x: bw, y: 0 },
    { x: bw, y: bh },
    { x: bw / 2, y: flatH },
    { x: 0, y: bh },
  ], [0, v.radius, v.radius + 2, v.radius - 2, v.radius + 2]);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${v.weight} ${v.f1Size}px 'S-Core Dream'`;
  ctx.fillText(String(v.month || '').padStart(2, '0'), bw / 2, v.f1Y);
  ctx.font = `${v.weight} ${v.f2Size}px 'S-Core Dream'`;
  ctx.fillText('신제품', bw / 2, v.f2Y);
  ctx.restore();

  if (v.store) {
    ctx.save();
    ctx.font = `${v.weight} ${v.storeSize}px 'S-Core Dream'`;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.textAlign = v.side === 'left' ? 'right' : 'left';
    const storeX = v.side === 'left' ? CW - v.storeMargin : v.storeMargin;
    const storeY = v.offY + bh / 2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 6;
    ctx.strokeText(v.store, storeX, storeY);
    ctx.fillStyle = '#111';
    ctx.fillText(v.store, storeX, storeY);
    ctx.restore();
  }
}

document.querySelectorAll('#controls input, #controls select').forEach(el => {
  el.addEventListener('input', () => {
    const valSpan = document.getElementById('v' + el.id.slice(1));
    if (valSpan) valSpan.textContent = el.value;
    draw();
  });
});

$('#btnReset').addEventListener('click', () => {
  $('#tOffX').value = DEFAULTS.offX; $('#vOffX').textContent = DEFAULTS.offX;
  $('#tOffY').value = DEFAULTS.offY; $('#vOffY').textContent = DEFAULTS.offY;
  $('#tBw').value = DEFAULTS.bw; $('#vBw').textContent = DEFAULTS.bw;
  $('#tBh').value = DEFAULTS.bh; $('#vBh').textContent = DEFAULTS.bh;
  $('#tNotch').value = DEFAULTS.notch; $('#vNotch').textContent = DEFAULTS.notch;
  $('#tRadius').value = DEFAULTS.radius; $('#vRadius').textContent = DEFAULTS.radius;
  $('#tF1Size').value = DEFAULTS.f1Size; $('#vF1Size').textContent = DEFAULTS.f1Size;
  $('#tF1Y').value = DEFAULTS.f1Y; $('#vF1Y').textContent = DEFAULTS.f1Y;
  $('#tF2Size').value = DEFAULTS.f2Size; $('#vF2Size').textContent = DEFAULTS.f2Size;
  $('#tF2Y').value = DEFAULTS.f2Y; $('#vF2Y').textContent = DEFAULTS.f2Y;
  $('#tStoreSize').value = DEFAULTS.storeSize; $('#vStoreSize').textContent = DEFAULTS.storeSize;
  $('#tStoreMargin').value = DEFAULTS.storeMargin; $('#vStoreMargin').textContent = DEFAULTS.storeMargin;
  draw();
});

$('#btnCopy').addEventListener('click', async () => {
  const v = getVals();
  const text =
`bw = ${v.bw}, bh = ${v.bh}, notch = ${v.notch}, radius = ${v.radius}
badgeOffsetX = ${v.offX}, badgeOffsetY = ${v.offY}
"07" 폰트크기 = ${v.f1Size}px, Y위치 = ${v.f1Y}
"신제품" 폰트크기 = ${v.f2Size}px, Y위치 = ${v.f2Y}
스토어명 폰트크기 = ${v.storeSize}px, 가장자리여백 = ${v.storeMargin}`;
  $('#output').value = text;
  try { await navigator.clipboard.writeText(text); } catch (e) {}
});

document.fonts.ready.then(draw);
draw();
</script>
</body>
</html>
