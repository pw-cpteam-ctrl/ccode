<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>메가하우스 신제품 예고 메이커</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ═══ 컨트롤 패널 ═══ -->
<div class="panel">
  <h1>메가하우스 신제품 예고 메이커</h1>
  <p class="desc">셀 위 드래그=위치 조정 · 스크롤=확대.</p>

  <!-- 보드 탭 -->
  <div class="sec">보드</div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center;">
    <div id="boardTabs" class="ptabs" style="flex-wrap:wrap;gap:5px;margin-bottom:0;"></div>
    <button class="btn-add-board" id="btnAddBoard">+ 보드 추가</button>
  </div>

  <!-- ══ 섹션 1: 레이아웃 수정 ══ -->
  <button class="psec-toggle" onclick="toggleSection('sec-layout',this)">레이아웃 수정 <span class="arrow">▾</span></button>
  <div class="psec-body" id="sec-layout" style="padding-top:10px">
    <div class="sec">헤더</div>
    <div class="row2" style="align-items:center">
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;"><input type="checkbox" id="chkHeader" onchange="toggleHeader()"/> 헤더 표시</label>
      <div class="field" style="margin:0"><label>꺼짐 여백</label><input type="range" id="headerPad" min="0" max="120" value="0" oninput="toggleHeader()"/></div>
    </div>
    <div class="row2" style="margin-top:6px">
      <div class="field"><label>월</label><input type="text" id="inMonth" value="6월"/></div>
      <div class="field"><label>오픈일 (노란색)</label><input type="text" id="inOpen" value="6/4"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>스토어명 텍스트</label><input type="text" id="inStore" value="메가하우스 공식 스토어"/></div>
      <div class="field"><label>굵기</label>
        <select id="storeFontWeight" onchange="syncHeader()" style="width:100%;background:var(--ui-card);border:1px solid var(--ui-border);color:var(--ui-text);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;">
          <option value="100">1—Thin</option><option value="200">2—ExtraLight</option><option value="300">3—Light</option>
          <option value="400">4—Regular</option><option value="500" selected>5—Medium</option><option value="600">6—SemiBold</option>
          <option value="700">7—Bold</option><option value="800">8—ExtraBold</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>스토어명 크기</label><input type="range" id="storeFontSize" min="14" max="40" value="22" oninput="syncHeader()"/></div>
      <div class="field"><label>타이틀 크기</label><input type="range" id="titleFontSize" min="40" max="120" value="92" oninput="syncHeader()"/></div>
      <div class="field"><label>스토어명 위치</label><input type="range" id="storeOffset" min="-400" max="400" value="0" oninput="syncHeader()"/></div>
    </div>
    <div class="sec">재판 배지</div>
    <div class="row2">
      <div class="field"><label>배경색</label><input type="text" id="badgeBg" value="#0d1580" placeholder="#0d1580" oninput="syncBadgeStyle()"/></div>
      <div class="field"><label>글자색</label><input type="text" id="badgeFg" value="#ffffff" placeholder="#ffffff" oninput="syncBadgeStyle()"/></div>
    </div>
    <div class="sec">푸터</div>
    <div class="row2" style="align-items:center;margin-bottom:4px">
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;"><input type="checkbox" id="chkFooter" onchange="toggleFooter()"/> 푸터 표시</label>
    </div>
    <div class="row2">
      <div class="field"><label>푸터 텍스트</label><input type="text" id="inFooter" value="국내외 사정에 따라 출시 시점 등 일부 사항이 변동될 수 있습니다."/></div>
      <div class="field"><label>푸터 위치</label><input type="range" id="footerOffset" min="-400" max="400" value="0" oninput="syncHeader()"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>푸터 크기</label><input type="range" id="footerFontSize" min="10" max="28" value="18" oninput="syncHeader()"/></div>
      <div class="field"><label>PW 스트로크</label><input type="range" id="pwStroke" min="0" max="10" value="0" step="0.5" oninput="syncPwStroke()"/></div>
      <div class="field"><label>하단 PW 로고</label><input type="range" id="pwLogoSize" min="16" max="200" value="32" oninput="syncLogoSize()"/></div>
      <div class="field"><label>상단 MH 로고</label><input type="range" id="logoSize" min="20" max="120" value="64" oninput="syncMegaLogoSize()"/></div>
    </div>
    <div class="sec">줄별 제품명 크기</div>
    <div id="rowControls"></div>
    <div class="sec">그라데이션</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
      <div class="field" style="text-align:center"><label>시작점<br/><span id="gradValS" style="font-size:10px">20%</span></label><input type="range" id="gradStart" min="0" max="90" value="20" step="1" oninput="syncGrad()"/></div>
      <div class="field" style="text-align:center"><label>퍼짐<br/><span id="gradValW" style="font-size:10px">30%</span></label><input type="range" id="gradWidth" min="5" max="200" value="30" step="1" oninput="syncGrad()"/></div>
      <div class="field" style="text-align:center"><label>농도<br/><span id="gradValO" style="font-size:10px">88%</span></label><input type="range" id="gradOpacity" min="0" max="200" value="88" step="1" oninput="syncGrad()"/></div>
      <div class="field" style="text-align:center"><label>압축<br/><span id="gradValC" style="font-size:10px">0%</span></label><input type="range" id="gradCompress" min="0" max="60" value="0" step="1" oninput="syncGrad()"/></div>
    </div>
    <details class="logos" style="margin-top:8px">
      <summary>로고 직접 교체</summary>
      <div class="field" style="margin-top:7px"><label>메가하우스 로고</label><input type="file" id="logoMega" accept="image/*"/></div>
      <div class="field"><label>PW: 로고</label><input type="file" id="logoPW" accept="image/*"/></div>
    </details>
  </div>

  <!-- ══ 섹션 2: 사진 수정 ══ -->
  <button class="psec-toggle" onclick="toggleSection('sec-photo',this)" style="margin-top:8px">사진 수정 <span class="arrow">▾</span></button>
  <div class="psec-body" id="sec-photo" style="padding-top:10px">
    <div class="sec">사진 업로드</div>
    <div class="dropzone" id="drop"><b>클릭</b>하거나 사진을 <b>드래그</b></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden/>
    <div class="items" id="itemList"></div>
    <div class="sec">제품명 일괄입력</div>
    <div class="field">
      <label>줄마다 한 제품명 → 순서대로 반영 (현재 보드 기준)</label>
      <textarea id="bulkInput" placeholder="주술회전&#10;귀멸의 칼날&#10;원피스&#10;(빈 줄 = 해당 칸 비움)"></textarea>
    </div>
    <button class="ghost" style="width:100%;margin-bottom:4px" id="btnApplyBulk">적용</button>
    <div class="sec">블러 설정 (블러 체크된 셀에 적용)</div>
    <div class="row2">
      <div class="field"><label>퍼짐 <span id="blurPxVal">10</span>px</label><input type="range" id="sliderBlurPx" min="0" max="30" value="10" oninput="blurPx=+this.value;document.getElementById('blurPxVal').textContent=this.value;refresh()"/></div>
      <div class="field"><label>밝기 <span id="blurBrightVal">80</span>%</label><input type="range" id="sliderBlurBright" min="50" max="120" value="80" oninput="blurBright=+this.value;document.getElementById('blurBrightVal').textContent=this.value;refresh()"/></div>
    </div>
  </div>

  <div class="actions">
    <button class="ghost" id="btnReset">초기화</button>
    <button class="ghost" id="btnDownload">이 보드 저장</button>
    <button class="primary" id="btnDownloadAll">전체 저장</button>
  </div>
</div>

<!-- ═══ 스테이지 ═══ -->
<div class="stage" id="stage">
  <div class="zoom-bar" id="zoomBar">
    <span class="zoom-bar-handle" id="zoomBarHandle" title="드래그해서 위치 이동">⠿</span>
    <span style="color:#fff;font-size:11px;font-weight:700;white-space:nowrap;">미리보기</span>
    <input type="range" id="previewZoom" min="20" max="100" value="50" step="1" style="width:120px;accent-color:#fff;cursor:pointer;" oninput="applyPreviewZoom(this.value)"/>
    <span id="previewZoomVal" style="color:#fff;font-size:11px;min-width:32px;">50%</span>
  </div>
  <div id="boardsContainer" class="boards-row"></div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="script.js"></script>
</body>
</html>
